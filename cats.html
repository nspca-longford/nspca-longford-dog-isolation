<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSPCA Longford &middot; Cats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230f172a'/%3E%3Cpath d='M28 30 L38 44 L62 44 L72 30 L72 58 A22 16 0 0 1 28 58 Z' fill='%237f77dd'/%3E%3Ccircle cx='42' cy='54' r='3.5' fill='%230f172a'/%3E%3Ccircle cx='58' cy='54' r='3.5' fill='%230f172a'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--color-background-primary:#fff;--color-text-primary:#0f172a;--color-text-secondary:#64748b;--color-border-secondary:#e2e8f0;--color-border-tertiary:#eef1f5;--lime:#c5e86c;--ink:#0f172a}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--color-text-primary);background:#f6f7f9;font-size:14px;line-height:1.45}
h2{font-size:18px;margin:0 0 4px}
.card{background:#fff;border:0.5px solid var(--color-border-secondary);border-radius:14px;padding:16px;margin-bottom:14px}
.lbl{display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
input,select,textarea{font-family:inherit;font-size:13px;color:#0f172a}
select{padding:8px 10px;border:1px solid rgba(15,23,42,0.12);border-radius:8px;background:#fff}
.btn{background:#f1f5f9;border:0.5px solid rgba(15,23,42,0.12);padding:9px 16px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit;color:#0f172a}
.btnp{background:var(--ink);color:var(--lime);border:none;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.ctgrid{display:grid;grid-template-columns:1fr;gap:0;align-items:start}
.ctcol{min-width:0}
.cards-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@media(max-width:900px){.g3{grid-template-columns:1fr}}
.statrail{display:flex;align-items:stretch;gap:0;margin-bottom:14px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.srstat{flex:1;padding:11px 14px;border-right:1px solid #e2e8f0;cursor:pointer;transition:background .12s;position:relative;background:none;font-family:inherit;text-align:left}
.srstat:last-child{border-right:none}
.srstat:hover{background:#fafafa}
.srstat.srstat.sel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#7f77dd}
.srstat.sel.g::after{background:#16a34a}.srstat.sel.y::after{background:#f59e0b}
.srstat.sel.r::after{background:#dc2626}.srstat.sel.b::after{background:#0f172a}
.srstat .srn{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:6px;color:#0f172a}
.srstat .srn .srd{width:7px;height:7px;border-radius:999px;margin-bottom:1px}
.srstat.g .srd{background:#16a34a}.srstat.y .srd{background:#f59e0b}.srstat.r .srd{background:#dc2626}.srstat.b .srd{background:#0f172a}
.srstat .srl{font-size:10.5px;color:#94a3b8;font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.dcardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dcard{background:#fff;border:1px solid #e2e8f0;border-radius:13px;cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(15,23,42,.03);transition:border-color .14s,box-shadow .14s,transform .14s}
.dcard:hover{border-color:#cbd5e1;box-shadow:0 4px 16px -8px rgba(15,23,42,.18);transform:translateY(-1px)}
.dcard .stripe{position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0}
.dcard.tg .stripe{background:#16a34a}.dcard.ty .stripe{background:#f59e0b}.dcard.tr .stripe{background:#dc2626}.dcard.tb .stripe{background:#0f172a}.dcard.tn .stripe{background:#e2e8f0}
.dcard-in{padding:12px 13px 12px 16px}
.dtop{display:flex;gap:10px;align-items:flex-start}
.dthumb{width:64px;height:64px;border-radius:14px;flex:none;overflow:hidden;background:linear-gradient(135deg,#fbfdf4,#eef7d8);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 1px rgba(19,22,27,.09),0 2px 6px -2px rgba(19,22,27,.12)}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dinfo{flex:1;min-width:0}
.dname{font-size:14px;font-weight:700;letter-spacing:-.005em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta{font-size:11px;color:#94a3b8;font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkennel{font-size:10px;font-weight:700;color:#475569;background:#f1f5f9;border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.dbottom{margin-top:10px;padding-top:9px;border-top:1px solid #f1f5f9}
.drow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dstatus{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
.dstatus .dd{width:7px;height:7px;border-radius:999px;flex:none}
.dcard.tg .dstatus .dd{background:#16a34a}.dcard.tg .dstatus{color:#16a34a}
.dcard.ty .dstatus .dd{background:#f59e0b}.dcard.ty .dstatus{color:#f59e0b}
.dcard.tr .dstatus .dd{background:#dc2626}.dcard.tr .dstatus{color:#dc2626}
.dcard.tb .dstatus .dd{background:#0f172a}.dcard.tb .dstatus{color:#0f172a}
.dcard.tn .dstatus .dd{background:#cbd5e1}.dcard.tn .dstatus{color:#94a3b8}
.dayno{font-size:10.5px;color:#94a3b8;font-weight:600;font-variant-numeric:tabular-nums}
.dflagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dflag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.dflag.ea{background:#C5E86C;color:#3a4a16}
.dflag.warn{background:#fef3e2;color:#b45309}
.dflag.crit{background:#fee2e2;color:#b91c1c}
.dflag.prov{background:#fff;color:#b45309;border:1px solid #f59e0b}
.dflag.ok{background:#f1f5f9;color:#94a3b8;font-weight:600}
.med-chev{color:#cbd5e1;font-size:15px;transition:transform .15s}
.apill{font-size:12px;padding:6px 15px;border-radius:18px;cursor:pointer;font-family:inherit;border:0.5px solid rgba(15,23,42,0.16);background:#fff;color:#475569}
.apill.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.tabbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabbtn{background:#fff;border:0.5px solid rgba(15,23,42,0.16);padding:7px 15px;font-size:12.5px;color:#475569;cursor:pointer;font-family:inherit;border-radius:18px}
.tabbtn.on{background:#0f172a;color:#fff;border-color:#0f172a;font-weight:600}
.dml{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;padding:8px 12px 3px}
.dmi{padding:9px 12px;font-size:13px;color:#0f172a;cursor:pointer;border-radius:8px}
.dmi:hover{background:#f1f5f9}
</style>
</head>

      <div style="font-size:13px;font-weight:600;color:#fff;letter-spacing:0.16em;margin-top:8px">LONGFORD</div>
      <div style="display:inline-flex;align-items:center;gap:6px;margin-top:13px;background:#1e293b;padding:4px 13px;border-radius:20px">
        <span style="color:#c5e86c;font-size:9px">&#9679;</span>
        <span style="color:#94a3b8;font-size:11px;font-weight:500">Cattery &amp; Isolation</span>
      </div>
    </div>
  <div style="max-width:380px;width:100%;margin:0 auto;padding:0 20px">
    <label style="display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">Access code</label>
    <input id="login-code" type="password" autocomplete="off" style="width:100%;padding:12px 14px;border:1px solid #334155;border-radius:11px;background:#1e293b;color:#fff;font-size:15px;margin-bottom:12px" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btnp" style="width:100%;padding:13px;font-size:14px;border-radius:11px;font-weight:700" onclick="doLogin()">Enter &rarr;</button>
    <div id="login-err" style="color:#fca5a5;font-size:12px;margin-top:10px;display:none">That code isn't recognised.</div>
    <div style="margin-top:26px;font-size:11px;color:#475569;text-align:center">Same codes as the dog app &middot; <a href="index.html" style="color:#94a3b8">Dogs &rarr;</a></div>
  </div>

  {version:"0.6",date:"2026-08-23",note:"The record reads like a details page now \u2014 a header strip with the cat's photo, name, pod, area and a big day counter, sitting above pill-style tabs like the dog app's. The dashboard has the \u2630 menu: What's new, a full CSV export of every cat, the jump to Dogs, and log out. And the page remembers which area you were looking at \u2014 leave it on Cat Iso and it opens on Cat Iso next time, no questions asked. A heather cat sits in the browser tab too."},

function initSupabase(){

    var base=SUPABASE_URL+"/rest/v1/"+table;

    return{
      select:function(cols){
        var q=base+"?select="+(cols||"*");
        var chain={
          eq:function(col,val){q+="&"+col+"=eq."+encodeURIComponent(val);return chain;},
          limit:function(n){q+="&limit="+n;return chain;},
          order:function(col,opts){q+="&order="+col+(opts&&opts.ascending===false?".desc":".asc");return chain;},
          then:function(res,rej){return fetch(q,{headers:headers}).then(function(r){return r.json().then(function(d){var result=r.ok?{data:d,error:null}:{data:null,error:d};if(res)res(result);return result;});}).catch(function(e){var result={data:null,error:{message:e.message}};if(rej)rej(result);return result;});}
        };return chain;
      },
      insert:function(rows){return fetch(base,{method:"POST",headers:Object.assign({},headers,{"Prefer":"return=representation"}),body:JSON.stringify(Array.isArray(rows)?rows[0]:rows)}).then(function(r){return r.json().then(function(d){return r.ok?{data:Array.isArray(d)?d:[d],error:null}:{data:null,error:d};});});},
      update:function(data){var q2=base;return{eq:function(col,val){q2+="?"+col+"=eq."+encodeURIComponent(val);return fetch(q2,{method:"PATCH",headers:Object.assign({},headers,{"Prefer":"return=representation"}),body:JSON.stringify(data)}).then(function(r){return r.json().then(function(d){return r.ok?{data:d,error:null}:{data:null,error:d};});});}};},
      delete:function(){return{eq:function(col,val){return fetch(base+"?"+col+"=eq."+encodeURIComponent(val),{method:"DELETE",headers:headers}).then(function(r){return r.ok?{data:null,error:null}:{data:null,error:{message:"Delete failed"}};});}};}
    };
  }};return true;
}

  });

function esc(s){return(s===null||s===undefined?"":""+s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function fmtDMY(ds){if(ds===null||ds===undefined||ds==="")return"";if(ds instanceof Date){if(isNaN(ds))return"";return ("0"+ds.getDate()).slice(-2)+"-"+("0"+(ds.getMonth()+1)).slice(-2)+"-"+(""+ds.getFullYear()).slice(2);}var p=(""+ds).slice(0,10).split("-");if(p.length===3&&p[0].length===4)return p[2]+"-"+p[1]+"-"+p[0].slice(2);return ""+ds;}
function fmtAgo(ts){if(!ts)return"never";var diff=Math.round((Date.now()-(typeof ts==="number"?ts:new Date(ts).getTime()))/60000);if(diff<1)return"just now";if(diff<60)return diff+"m ago";if(diff<1440)return Math.round(diff/60)+"h ago";return Math.round(diff/1440)+"d ago";}
function daysSince(ds){if(!ds)return null;var p=String(ds).slice(0,10).split("-");if(p.length!==3)return null;var then=new Date(+p[0],(+p[1])-1,+p[2]);if(isNaN(then.getTime()))return null;var n=new Date();var today=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.max(0,Math.round((today-then)/864e5));}
function initials(n){var p=(n||"").trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():(n||"?").slice(0,2).toUpperCase();}

var cats=[],C=null,_recTab="cat";
function activeContagiousCats(medical){var ds=(medical&&medical.diseases)||[];return ds.filter(function(p){return CONTAGIOUS_CATS[p.type]&&p.status!=="Recovered / cleared";});}
function catHasDeparted(st){var o=((st||C).fin||{}).outcome||"";return !!o;}

// ── load / cache / save — the same safety net as the dog app ──────
var _catsFromCache=false,_catsCachedAt=0,_tableMissing=false;
function cacheCats(){try{localStorage.setItem("nspca-cats-cache",JSON.stringify({at:Date.now(),rows:cats}));}catch(e){}}
function loadCachedCats(){try{var raw=localStorage.getItem("nspca-cats-cache");if(!raw)return false;var o=JSON.parse(raw);if(!o||!o.rows)return false;cats=o.rows;_catsFromCache=true;_catsCachedAt=o.at||0;return true;}catch(e){return false;}}
async function loadCats(){
  if(!supabaseClient)return;
  var res;
  try{res=await supabaseClient.from("cats").select("*").order("saved_at",{ascending:false}).limit(400);}
  catch(e){loadCachedCats();return;}
  if(!res||res.error){
    if(res&&res.error&&/relation|does not exist|not found|42P01/i.test(JSON.stringify(res.error)))_tableMissing=true;
    loadCachedCats();return;
  }
  _tableMissing=false;
  cats=(res.data||[]).map(function(row){var st=null;try{st=typeof row.data==="string"?JSON.parse(row.data):row.data;}catch(e){}
    return{id:row.id,name:row.name||"Unknown",area:row.area||((st&&st.area)||"iso"),intakeDate:row.intake_date,savedAt:row.saved_at,state:st||defaultCat()};});
  _catsFromCache=false;cacheCats();
  if(catPendingCount())scheduleCatRetry();
}
function catPendingGet(){try{return JSON.parse(localStorage.getItem("nspca-cats-pending")||"{}");}catch(e){return {};}}
function catPendingSet(o){try{localStorage.setItem("nspca-cats-pending",JSON.stringify(o));}catch(e){}}
function catPendingCount(){return Object.keys(catPendingGet()).length;}
function catPendingPark(id,row){var p=catPendingGet();p[id||"new"]={row:row,at:new Date().toISOString()};catPendingSet(p);scheduleCatRetry();}
function catPendingClear(id){var p=catPendingGet();delete p[id||"new"];catPendingSet(p);}
var _catRetry=null;
function scheduleCatRetry(){if(_catRetry||!catPendingCount())return;_catRetry=setTimeout(function(){_catRetry=null;retryCatPending();},15000);}
async function retryCatPending(){
  if(!supabaseClient||!catPendingCount())return;
  var p=catPendingGet();var ids=Object.keys(p);
  for(var i=0;i<ids.length;i++){
    var id=ids[i];
    try{
      if(id==="new"){var r1=await supabaseClient.from("cats").insert(p[id].row);if(r1&&r1.error)throw r1.error;}
      else{var r2=await supabaseClient.from("cats").update(p[id].row).eq("id",id);if(r2&&r2.error)throw r2.error;}
      catPendingClear(id);
    }catch(e){}
  }
  if(catPendingCount())scheduleCatRetry();
  else{try{await loadCats();if(!C)renderDashboard();}catch(e){}}
}
var _saveBusy=false,_saveAgain=false,_saveFailed=false,_saveTimer=null,_openId=null;
function setSaveState(t){var el=document.getElementById("save-state");if(el)el.textContent=t;}
async function saveCat(){
  if(!C||!supabaseClient)return;
  if(_saveBusy){_saveAgain=true;return;}
  _saveBusy=true;setSaveState("Saving\u2026");
  C._savedBy=currentName();
  var row={name:(C.cat&&C.cat.name)||"",area:C.area||"iso",intake_date:(C.cat&&C.cat.intakeDate)||null,saved_at:new Date().toISOString(),data:C};
  try{
    if(_openId){var up=await supabaseClient.from("cats").update(row).eq("id",_openId);if(up&&up.error)throw up.error;}
    else{var res=await supabaseClient.from("cats").insert(row);if(res&&res.error)throw res.error;if(res&&res.data&&res.data[0])_openId=res.data[0].id;}
    catPendingClear(_openId);
    _saveFailed=false;setSaveState("Saved "+fmtAgo(Date.now()));
  }catch(e){
    console.error("saveCat:",e);
    catPendingPark(_openId,row);
    setSaveState("Held \u2014 will retry");
    if(!_saveFailed){_saveFailed=true;miniToast("Not saved yet \u2014 held until you\u0027re back online");}
  }finally{
    _saveBusy=false;
    if(_saveAgain){_saveAgain=false;saveCat();}
  }
}
function debouncedSave(){clearTimeout(_saveTimer);setSaveState("\u2026");_saveTimer=setTimeout(saveCat,700);}

// ── field plumbing ────────────────────────────────────────────────
function setF(path,val){
  if(!C)return;
  var p=path.split(".");var o=C;
  for(var i=0;i<p.length-1;i++){if(!o[p[i]])o[p[i]]={};o=o[p[i]];}
  o[p[p.length-1]]=val;
  debouncedSave();
}
function setFR(path,val){setF(path,val);renderMain();}
function fld(label,val,path,type,ph){return '<div style="margin-bottom:9px"><label class="lbl">'+label+'</label><input type="'+(type||"text")+'" value="'+esc(val||"")+'" placeholder="'+(ph||"")+'" oninput="setF(\''+path+'\',this.value)" style="width:100%;padding:8px 10px;border:1px solid rgba(15,23,42,0.12);border-radius:8px"></div>';}
function slct(label,val,path,opts){return '<div style="margin-bottom:9px"><label class="lbl">'+label+'</label><select onchange="setFR(\''+path+'\',this.value)" style="width:100%">'+opts.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(val===v?' selected':'')+'>'+esc(l)+'</option>';}).join("")+'</select></div>';}
function ta(label,val,path,ph){return '<div style="margin-bottom:9px"><label class="lbl">'+label+'</label><textarea oninput="setF(\''+path+'\',this.value)" placeholder="'+(ph||"")+'" style="width:100%;min-height:70px;padding:8px 10px;border:1px solid rgba(15,23,42,0.12);border-radius:8px;resize:vertical">'+esc(val||"")+'</textarea></div>';}

function catCardHtml(r){

  var meta=[c.colour||null,c.sex?String(c.sex).split(" ")[0]:null,c.ageEstimate||null].filter(Boolean).join(" \u00b7 ");

}

    +'</div></div></div>';
}
function renderMedicalTab(){
  var m=C.medical||{};var t=m.testing||{};
  var con=activeContagiousCats(m);
  var banner=con.length?hybridBanner("Contagious \u2014 "+esc(con.map(function(x){return x.type;}).join(", ")),"alert")
    :m.currentStatus==="Not fit for rehoming"?hybridBanner("Not fit for rehoming","alert")
    :hybridBanner(m.currentStatus||"No health status set",m.currentStatus==="Healthy"?"ok":m.currentStatus?"warn":"");
  var testSum=[t.felv?("FeLV "+t.felv):null,t.fiv?("FIV "+t.fiv):null,t.testedDate?fmtDMY(t.testedDate):null].filter(Boolean).join(" \u00b7 ")||"Not tested yet";
  var testTone=(t.felv==="Positive"||t.fiv==="Positive")?"alert":(!t.felv&&!t.fiv)?"warn":"";
  var dsRows=(m.diseases||[]).map(function(p,i){
    var act=p.status!=="Recovered / cleared";
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px">'
      +'<span style="flex:1;color:'+(act&&CONTAGIOUS_CATS[p.type]?"#991b1b;font-weight:600":"#334155")+'">'+esc(p.type)+(CONTAGIOUS_CATS[p.type]&&act?" \u2623\ufe0f":"")+'</span>'
      +'<span style="color:#94a3b8">'+esc(p.status||"")+(p.date?" \u00b7 "+fmtDMY(p.date):"")+'</span>'
      +'<button onclick="cycleDisease('+i+')" style="background:#e2e8f0;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">'+(act?"Mark cleared":"Reactivate")+'</button>'
      +'<button onclick="removeDisease('+i+')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">&#10005;</button></div>';
  }).join("")||'<div style="font-size:11.5px;color:#cbd5e1;padding:2px 0 6px">Nothing recorded.</div>';
  var vaxRows=(m.vaccinations||[]).map(function(v,i){
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px"><span style="flex:1">'+esc(v.type)+'</span><span style="color:#94a3b8">'+fmtDMY(v.date)+(v.nextDue?" \u00b7 next "+fmtDMY(v.nextDue):"")+'</span><button onclick="removeVax('+i+')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">&#10005;</button></div>';
  }).join("")||'<div style="font-size:11.5px;color:#cbd5e1;padding:2px 0 6px">None recorded yet.</div>';
  return '<div class="ctgrid"><div class="ctcol"><div class="card">'+banner
    +slct("Health status",m.currentStatus||"","medical.currentStatus",[["","\u2014 not set \u2014"],["Healthy","Healthy"],["Monitoring","Monitoring"],["Under treatment","Under treatment"],["Recovering","Recovering"],["Not fit for rehoming","Not fit for rehoming"]])
    +hybridRow("ct-test","\ud83e\uddea","FeLV / FIV testing",esc(testSum),
      '<div class="g3">'+slct("FeLV",t.felv||"","medical.testing.felv",[["","Not tested"],["Negative","Negative"],["Positive","Positive"],["Retest needed","Retest needed"]])
      +slct("FIV",t.fiv||"","medical.testing.fiv",[["","Not tested"],["Negative","Negative"],["Positive","Positive"],["Retest needed","Retest needed"]])
      +fld("Tested",t.testedDate,"medical.testing.testedDate","date")+'</div>',testTone)
    +hybridRow("ct-dis","\ud83e\udda0","Conditions & diseases",((m.diseases||[]).length?(m.diseases.length+" recorded"+(con.length?" \u00b7 "+con.length+" contagious":"")):"Nothing recorded"),
      dsRows+'<div style="display:flex;gap:8px;margin-top:8px"><select id="new-disease" style="flex:1">'+CAT_DISEASES.map(function(dd){return '<option>'+dd+'</option>';}).join("")+'</select><button class="btn" onclick="addDisease()">Add</button></div>',con.length?"alert":"")
    +'</div></div>'
    +'<div class="ctcol"><div class="card">'
    +hybridRow("ct-vax","\ud83d\udc89","Vaccinations",((m.vaccinations||[]).length?m.vaccinations.length+" recorded":"None recorded yet"),
      vaxRows+'<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><select id="new-vax" style="flex:1;min-width:130px">'+CAT_VAX.map(function(v){return '<option>'+v+'</option>';}).join("")+'</select><input id="new-vax-date" type="date" style="padding:8px 10px;border:1px solid rgba(15,23,42,0.12);border-radius:8px"><button class="btn" onclick="addVax()">Add</button></div>',(m.vaccinations||[]).length?"":"warn")
    +ta("Vet notes",m.vetNotes,"medical.vetNotes","anything the vet said or needs watching")
    +'</div></div></div>';
}
function addDisease(){var el=document.getElementById("new-disease");if(!el)return;C.medical.diseases=C.medical.diseases||[];C.medical.diseases.push({type:el.value,status:"Active",date:new Date().toISOString().slice(0,10)});debouncedSave();renderMain();}
function cycleDisease(i){var p=(C.medical.diseases||[])[i];if(!p)return;p.status=p.status==="Recovered / cleared"?"Active":"Recovered / cleared";debouncedSave();renderMain();}
function removeDisease(i){appConfirm("Remove this condition from the record?",function(){C.medical.diseases.splice(i,1);debouncedSave();renderMain();});}
function addVax(){var el=document.getElementById("new-vax");var de=document.getElementById("new-vax-date");if(!el)return;C.medical.vaccinations=C.medical.vaccinations||[];C.medical.vaccinations.push({type:el.value,date:(de&&de.value)||new Date().toISOString().slice(0,10)});debouncedSave();renderMain();}
function removeVax(i){appConfirm("Remove this vaccination entry?",function(){C.medical.vaccinations.splice(i,1);debouncedSave();renderMain();});}
function renderWeightsTab(){
  var ws=(C.weights||[]).slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
  var rows=ws.slice().reverse().map(function(w,ri){var i=ws.length-1-ri;
    var prev=i>0?ws[i-1]:null;var diff=prev?(w.kg-prev.kg):null;
    return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12.5px"><span style="color:#94a3b8;width:70px">'+fmtDMY(w.date)+'</span><span style="font-weight:600">'+w.kg+' kg</span>'+(diff!==null?'<span style="font-size:11px;color:'+(diff<0?"#991b1b":"#166534")+'">'+(diff>0?"+":"")+diff.toFixed(2)+'</span>':'')+'<span style="flex:1"></span><button onclick="removeWeight('+i+')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">&#10005;</button></div>';
  }).join("")||'<div style="font-size:11.5px;color:#cbd5e1;padding:2px 0 8px">No weights yet \u2014 the first one becomes the baseline.</div>';
  return '<div class="card" style="max-width:560px">'
    +'<div style="display:flex;gap:8px;margin-bottom:12px"><input id="new-w" type="number" step="0.01" placeholder="kg" style="width:110px;padding:8px 10px;border:1px solid rgba(15,23,42,0.12);border-radius:8px"><input id="new-w-date" type="date" value="'+new Date().toISOString().slice(0,10)+'" style="padding:8px 10px;border:1px solid rgba(15,23,42,0.12);border-radius:8px"><button class="btn btnp" onclick="addWeight()">Add</button></div>'
    +rows+'</div>';
}
function addWeight(){var el=document.getElementById("new-w");var de=document.getElementById("new-w-date");var kg=parseFloat(el&&el.value);if(!kg)return;C.weights=C.weights||[];C.weights.push({date:(de&&de.value)||new Date().toISOString().slice(0,10),kg:kg});debouncedSave();renderMain();}
function removeWeight(i){var ws=(C.weights||[]).slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));});var w=ws[i];C.weights=C.weights.filter(function(x){return x!==w;});debouncedSave();renderMain();}
function renderNotesTab(){
  var ns=C.notices||[];
  var rows=ns.map(function(n,i){return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px"><span style="flex:1">\ud83d\udd14 '+esc(n.text)+'</span><span style="color:#94a3b8;font-size:11px">'+(n.by?esc(n.by)+" \u00b7 ":"")+fmtDMY(n.at)+'</span><button onclick="removeNotice('+i+')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">&#10005;</button></div>';}).join("")||'<div style="font-size:11.5px;color:#cbd5e1;padding:2px 0 8px">No notices \u2014 anything the whole team must know about this cat goes here.</div>';
  return '<div class="ctgrid"><div class="ctcol"><div class="card">'
    +'<div style="font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#94a3b8;margin:0 0 8px">Notices</div>'
    +rows+'<div style="display:flex;gap:8px;margin-top:8px"><input id="new-notice" type="text" placeholder="e.g. door-darter \u2014 double-check the pen latch" style="flex:1;padding:8px 10px;border:1px solid rgba(15,23,42,0.12);border-radius:8px"><button class="btn" onclick="addNotice()">Add</button></div>'
    +'</div></div>'
    +'<div class="ctcol"><div class="card">'+ta("General notes",C.notes,"notes","temperament, habits, anything worth knowing")+'</div></div></div>';
}
function addNotice(){var el=document.getElementById("new-notice");if(!el||!el.value.trim())return;C.notices=C.notices||[];C.notices.push({text:el.value.trim(),by:currentName(),at:new Date().toISOString().slice(0,10)});el.value="";debouncedSave();renderMain();}
function removeNotice(i){C.notices.splice(i,1);debouncedSave();renderMain();}
function renderOutcomeTab(){
  var f=C.fin||{};
  var banner=f.outcome?hybridBanner(esc(f.outcome)+(f.outcomeDate?" \u00b7 "+fmtDMY(f.outcomeDate):""),"alert"):hybridBanner("Active \u2014 in the unit","ok");
  return '<div class="card" style="max-width:560px">'+banner
    +slct("Outcome",f.outcome||"","fin.outcome",CAT_OUTCOMES.map(function(o){return [o,o||"Active \u2014 in the unit"];}))
    +fld("Date",f.outcomeDate,"fin.outcomeDate","date")
    +ta("Outcome notes",f.outcomeNotes,"fin.outcomeNotes","where it went, who took it, anything worth keeping")
    +(f.outcome?'<div style="font-size:11.5px;color:#854d0e;background:#fef9c3;border-radius:8px;padding:8px 11px">A cat with an outcome leaves the live dashboard and shows under Departed.</div>':'')
    +'</div>';
}

// ── init ──────────────────────────────────────────────────────────
(function(){
  initSupabase();
  var savedCode=localStorage.getItem("nspca-intake-auth");
  if(savedCode){
    findUserByCode(savedCode).then(function(u){
      if(u){LOGGED_IN=true;CURRENT_USER=u;localStorage.setItem("nspca-user-name",u.name);localStorage.setItem("nspca-user-role",u.role);
        loadCats().then(function(){showScreen("dashboard-screen");renderDashboard();});}
      else showScreen("login-screen");
    });
  }else showScreen("login-screen");
})();
</script>
</body>
</html>
