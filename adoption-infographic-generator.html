body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f5f2;color:#282932}
.top{background:#282932;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.top img{height:22px;display:block}.top .t{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9a9fa8;border-left:1px solid #454857;padding-left:12px;margin-left:12px}
.top .l{display:flex;align-items:center}
.btn{background:#fff;border:1.5px solid #d9dcd3;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#282932}
.btnp{background:#c6e76c;border-color:#c6e76c;font-weight:800}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:10px}.form{position:static;max-height:none}.top{flex-wrap:wrap}.top>div:last-child{width:100%;display:flex;gap:6px}.top .btn{flex:1;padding:9px 6px;font-size:12px}}
.form{background:#fff;border:1px solid #e4e7e0;border-radius:14px;padding:16px;align-self:start;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.fg{margin-bottom:10px}.fg label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;color:#868b7e;margin-bottom:4px}
.fg input{width:100%;box-sizing:border-box;border:1.5px solid #e4e7e0;background:#fbfcf9;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:#282932;font-family:inherit;outline:none}
.fg input:focus{border-color:#282932;background:#fff;box-shadow:0 0 0 3px rgba(198,231,108,.45)}
.drop{border:1.5px dashed #cfd4c8;border-radius:10px;padding:14px;text-align:center;font-size:12px;color:#6b7280;font-weight:600;cursor:pointer;margin-bottom:12px}
.drop.on{border-color:#c6e76c;background:#f7fbe9}
.previewPane{overflow:auto}
#scaler{transform-origin:top left}
.kc-sheet{width:210mm;height:297mm;background:#fff;color:#282932;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:grid;grid-template-rows:auto auto 1fr auto auto;overflow:hidden;position:relative}
.kc-sheet *{box-sizing:border-box}
.kc-top{display:grid;grid-template-columns:1fr 66mm;background:#282932;color:#fff}
.kc-id{padding:9mm 11mm 7mm;min-width:0}
.kc-k{font-size:8.5pt;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#9a9fa8}
.kc-con{background:#dc2626;color:#fff;padding:.5mm 2mm;border-radius:1.5mm;letter-spacing:.1em}
.kc-ready{background:#c6e76c;color:#282932;padding:.5mm 2mm;border-radius:1.5mm;letter-spacing:.06em;text-transform:none;font-weight:900}
.kc-name{font-size:56pt;font-weight:900;letter-spacing:-.03em;line-height:.95;margin-top:2mm;word-break:break-word}
.kc-who{font-size:12.5pt;font-weight:700;color:#cdd3df;margin-top:3.5mm}
.kc-words{margin-top:3.5mm;display:flex;gap:2mm;flex-wrap:wrap}.kc-words span{background:#c6e76c;color:#282932;font-weight:900;font-size:10.5pt;padding:1.4mm 3.2mm;border-radius:2mm}
.kc-kn{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;padding:7mm 9mm 7mm 0}
.kc-kn img{height:7.5mm;opacity:.95}
.kc-num{font-size:54pt;font-weight:900;color:#c6e76c;line-height:.9;letter-spacing:-.03em}
.kc-since{text-align:right;font-size:9pt;font-weight:700;color:#9a9fa8;line-height:1.35}.kc-since b{color:#fff}
.kc-rule{display:grid;grid-template-columns:34mm 1fr;align-items:stretch}
.kc-lt{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:18pt;font-weight:900;letter-spacing:-.01em;text-align:center;line-height:1;padding:3mm}
.kc-lt small{font-size:9pt;font-weight:800;margin-top:1.5mm;opacity:.85}
.kc-tx{padding:4.5mm 8mm;font-size:15pt;font-weight:800;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.kc-tx small{display:block;font-size:9.5pt;font-weight:700;opacity:.75;margin-top:1.5mm}
.kc-body{display:grid;grid-template-columns:58mm 1fr 1fr;min-height:0}
.kc-col{padding:6mm 7mm;border-right:.5mm solid #e4e7e0;min-width:0;overflow:hidden}.kc-col:last-child{border-right:none}
.kc-h{font-size:8.5pt;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:3.5mm;padding-bottom:1.5mm;border-bottom:.8mm solid #c6e76c}
.kc-photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4mm;display:block;margin-bottom:4mm;background:#eef1ea}
.kc-nophoto{display:flex;align-items:center;justify-content:center;color:#9a9fa8;font-weight:800;font-size:9pt;border:.8mm dashed #cfd4c8}
.kc-fact{display:flex;justify-content:space-between;gap:3mm;font-size:9pt;padding:1.8mm 0;border-bottom:.4mm solid #eef0ea}.kc-fact span{color:#6b7280;font-weight:700;flex-shrink:0}.kc-fact b{font-weight:800;text-align:right;word-break:break-all}
.kc-rules{margin:0;padding:0}.kc-rules li{list-style:none;font-size:12.5pt;font-weight:900;padding:2.6mm 3.2mm;border-radius:2.5mm;margin-bottom:2.2mm;background:#fee2e2;color:#991b1b;line-height:1.2}
.kc-rules li.crit{background:#dc2626;color:#fff}
.kc-rules li.ok{background:#dcfce7;color:#166534}
.kc-rules li.note{background:#f1f3ee;color:#282932;font-weight:700;font-size:10.5pt;line-height:1.35}
.kc-tt{width:100%;border-collapse:collapse}
.kc-tt td{border-bottom:.4mm solid #eef0ea;padding:2.2mm 0;font-size:10pt;font-weight:700;vertical-align:middle;line-height:1.25}
.kc-tt td.t{width:13mm;color:#6b7280;font-weight:900}
.kc-tt td.b{width:8mm;text-align:right}.kc-tt td.b i{display:inline-block;width:5.5mm;height:5.5mm;border:.6mm solid #282932;border-radius:1.2mm}
.kc-empty{font-size:10.5pt;font-weight:700;color:#4b5160;line-height:1.4}
.kc-settle{margin-top:4mm;font-size:10.5pt;line-height:1.5;font-weight:700;color:#282932;border-top:.4mm solid #eef0ea;padding-top:3mm}
.kc-pen{margin:0 7mm 4mm;border:.5mm dashed #cfd4c8;border-radius:3mm;min-height:30mm;padding:3mm 4mm;font-size:11pt;font-weight:600;line-height:1.5;white-space:pre-wrap}
.kc-pen:empty::before{content:attr(data-ph);font-size:8.5pt;font-weight:800;color:#9a9fa8;letter-spacing:.14em;text-transform:uppercase}
.kc-pen:focus{outline:.6mm solid #c6e76c}
.kc-foot{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6mm;padding:4mm 7mm 6mm;border-top:.5mm solid #e4e7e0}
.kc-help{font-size:10.5pt;font-weight:800;line-height:1.4}.kc-help span{color:#991b1b}
.kc-help small{display:block;font-size:7.5pt;color:#9a9fa8;font-weight:700;margin-top:1.5mm;letter-spacing:.02em}
.kc-qr{width:22mm;text-align:center}.kc-qr img{width:22mm;height:22mm;display:block;border:.5mm solid #cfd4c8;border-radius:2mm;padding:1mm;background:#fff}.kc-qr span{display:block;font-size:6.5pt;font-weight:800;color:#6b7280;margin-top:1mm}
@page{size:A4;margin:0}
@media print{body{background:#fff;margin:0}.kc-sheet{width:210mm;height:297mm;box-shadow:none;page-break-after:always}}

function kcCardHtml(P,MARK){
  var e=kcEsc;var tl=P.tl?(KC_TL[P.tl]||["#f1f3ee","#282932","#cfd4c8","#282932"]):null;
  var words=P.threeWords?'<div class="kc-words">'+String(P.threeWords).split(/[·,;]+/).map(function(w){return w.trim();}).filter(Boolean).slice(0,4).map(function(w){return '<span>'+e(w)+'</span>';}).join('')+'</div>':'';
  var who=[P.breed+(P.breed2?' × '+P.breed2:''),P.sex,P.age,P.weight].filter(Boolean).join(' · ');
  var top='<div class="kc-top"><div class="kc-id"><div class="kc-k">Dog Isolation Unit · Longford'+(P.contagious&&P.contagious.length?' · <span class="kc-con">CONTAGIOUS</span>':'')+(P.readyLabel?' · <span class="kc-ready">'+e(P.readyLabel)+'</span>':'')+'</div><div class="kc-name">'+e((P.name||'Unnamed dog').toUpperCase())+'</div><div class="kc-who">'+e(who||'—')+'</div>'+words+'</div>'
    +'<div class="kc-kn"><img src="'+MARK+'" alt="NSPCA"><div class="kc-num">'+e(kcShortKennel(P.kennel))+'</div><div class="kc-since">'+(P.intake?'In since <b>'+e(P.intake)+'</b>'+(P.inDay?' · day '+e(String(P.inDay)):''):'')+(P.assessor?'<br>Ask for <b>'+e(P.assessor)+'</b>':'')+'</div></div></div>';
  var rule;
  if(tl){var lbl=P.tl.toUpperCase()+(P.score!=null&&P.score!==''?'<small>'+e(String(P.score))+'/24</small>':'');var why=P.floored?'Held at '+e(P.tl)+(P.floorCat?' by a finding in '+e(P.floorCat):'')+' — do not downgrade.':(P.scoreProvisional?'Provisional — '+(P.scoredN!=null?P.scoredN:'?')+' of 6 categories scored.':'');
    rule='<div class="kc-rule" style="background:'+tl[0]+';color:'+tl[1]+'"><div class="kc-lt" style="background:'+tl[2]+';color:'+tl[3]+'">'+lbl+'</div><div class="kc-tx">'+e(P.walkRule||'Who can walk this dog: ask the assessor.')+(why?'<small>'+why+'</small>':'')+'</div></div>';}
  else rule='<div class="kc-rule" style="background:#f1f3ee;color:#4b5160"><div class="kc-lt" style="background:#cfd4c8;color:#282932">NOT<br>SCORED</div><div class="kc-tx">Designated staff only until assessed.</div></div>';
  var facts=[["Chip",P.chip],["Ref",P.ref],["In",[P.intake,P.reason].filter(Boolean).join(' · ')],["Iso ends",P.isoEnds],["Vax",P.vax],["Next vet",P.nextVet],["Weight",P.weight?(P.weight+(P.weightTrend?' '+P.weightTrend.slice(0,1):'')):''],["Parasite",P.parasite],["Neutered",P.neutered]].filter(function(f){return f[1];}).slice(0,8);
  var left='<div class="kc-col kc-left">'+(P.photo?'<img class="kc-photo" src="'+P.photo+'" alt="">':'<div class="kc-photo kc-nophoto">No photo</div>')+facts.map(function(f){return '<div class="kc-fact"><span>'+e(f[0])+'</span><b>'+e(f[1])+'</b></div>';}).join('')+'</div>';
  var rules=[];
  if(P.contagious&&P.contagious.length)rules.push('<li class="crit">CONTAGIOUS — '+e(P.contagious.join(', '))+(P.zoonotic?' · zoonotic':'')+' · full PPE · serve last</li>');
  if(P.restrictedLabel)rules.push('<li>'+e(P.restrictedLabel)+' — muzzle in public</li>');
  (P.warnings||[]).forEach(function(w){var t=typeof w==="string"?w:w.text;var c=typeof w==="object"&&w.critical;rules.push('<li'+(c?' class="crit"':'')+'>'+e(t)+'</li>');});
  (P.rules||[]).forEach(function(r){rules.push('<li class="'+(r[0]==='ok'?'ok':'')+'">'+e(r[1])+'</li>');});
  var human=(P.notices||[]).map(function(n){return typeof n==="string"?n:n.text;}).filter(Boolean);
  if(P.eaMgmt)human.push('EA: '+P.eaMgmt);
  var mid='<div class="kc-col"><div class="kc-h">Before you open the door</div><ul class="kc-rules">'+(rules.length?rules.join(''):'<li class="ok">No warnings on record — standard handling</li>')+(human.length?'<li class="note">'+e(human.join(' · '))+'</li>':'')+'</ul></div>';
  var tt=(P.timetable||[]).slice();
  if(P.walkLine)tt.push({t:'12:00',w:P.walkLine});
  tt.sort(function(a,b){return String(a.t).localeCompare(String(b.t));});
  var today=tt.length?'<table class="kc-tt">'+tt.map(function(r){return '<tr><td class="t">'+e(r.t)+'</td><td>'+e(r.w)+'</td><td class="b"><i></i></td></tr>';}).join('')+'</table>':'<div class="kc-empty">'+e([P.feeding,P.meds].filter(Boolean).join(' · ')||'No feeding plan or medication on record.')+'</div>';
  var settle=P.settleLine?'<div class="kc-settle">'+e(P.settleLine)+'</div>':'';
  var right='<div class="kc-col"><div class="kc-h">Today</div>'+today+settle+'</div>';
  var pen='<div class="kc-pen" data-ph="Written on the door — pen, or tap here to type">'+e(P.notes||'')+'</div>';
  var qr=P.webUrl?'<div class="kc-qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=0&data='+encodeURIComponent(P.webUrl)+'" alt=""><span>see '+e(P.name||'this dog')+' online</span></div>':'';
  var foot='<div class="kc-foot"><div class="kc-help">Something wrong? <span>'+e(P.escalation||'Unit supervisor first · then the manager')+'</span>'+(P.vetLine?' · Vet line <span>'+e(P.vetLine)+'</span>':'')+'<small>'+e(P.foot||'')+' · reprint when anything above changes · NSPCA Longford · Dog Isolation Unit</small></div>'+qr+'</div>';
  return '<div class="kc-sheet">'+top+rule+'<div class="kc-body">'+left+mid+right+'</div>'+pen+foot+'</div>';
}

function payloadFromForm(){var P={};for(var k in DATA)P[k]=DATA[k];
  P.name=val('f_name');P.ref=val('f_ref');P.kennel=val('f_kennel');P.breed=val('f_breed');P.breed2=val('f_breed2');P.sex=val('f_sex');P.age=val('f_age');P.size=val('f_size');P.colour=val('f_colour');P.weight=val('f_weight');P.chip=val('f_chip');P.vax=val('f_vax');P.parasite=val('f_parasite');P.neutered=val('f_neutered');P.intake=val('f_intake');P.isoEnds=val('f_isoends');P.meds=val('f_meds');P.feeding=val('f_feeding');P.handling=val('f_handling');P.notes=val('f_notes');P.threeWords=val('f_words');P.assessor=val('f_assessor');P.webUrl=val('f_web');
  P.foot=DATA.foot||('Printed '+new Date().toLocaleString('en-IE'));return P;}
function render(){document.getElementById('sheet').innerHTML=kcCardHtml(payloadFromForm(),MARK).replace('<div class="kc-sheet">','<div class="kc-sheet" contenteditable="true" spellcheck="false">');fit();}
function loadPayload(){try{var raw=localStorage.getItem('nspca-kennelcard');if(raw)return JSON.parse(raw);}catch(e){}
  var p=new URLSearchParams(location.search),obj=null;['name','ref','kennel','breed','breed2','sex','age','size','colour','weight','chip','vax','parasite','neutered','intake','isoends','meds','feeding','handling'].forEach(function(k){if(p.has(k)){obj=obj||{};obj[k]=p.get(k);}});return obj;}
function applyPayload(pl){if(!pl)return;
  setVal('f_name',pl.name);setVal('f_ref',pl.ref!=null?pl.ref:pl.refNo);setVal('f_kennel',pl.kennel);setVal('f_breed',pl.breed);setVal('f_breed2',pl.breed2);setVal('f_sex',pl.sex);setVal('f_age',pl.age);setVal('f_size',pl.size);setVal('f_colour',pl.colour);setVal('f_weight',pl.weight);setVal('f_chip',pl.chip!=null?pl.chip:pl.microchip);setVal('f_intake',pl.intake!=null?pl.intake:pl.intakeDate);setVal('f_vax',pl.vax);setVal('f_parasite',pl.parasite);setVal('f_neutered',pl.neutered);setVal('f_isoends',pl.isoEnds!=null?pl.isoEnds:pl.isoends);setVal('f_meds',pl.meds);setVal('f_feeding',pl.feeding);setVal('f_handling',pl.handling);setVal('f_words',pl.threeWords);setVal('f_assessor',pl.assessor);setVal('f_web',pl.webUrl);
  DATA={isoLabel:pl.isoLabel||'',isoState:pl.isoState||'',tl:pl.tl||'',score:pl.score,walkRule:pl.walkRule||'',scoreProvisional:!!pl.scoreProvisional,scoredN:pl.scoredN,scoredOf:pl.scoredOf,floored:!!pl.floored,floorCat:pl.floorCat||'',eaCat:pl.eaCat||'',eaMgmt:pl.eaMgmt||'',contagious:pl.contagious||[],zoonotic:!!pl.zoonotic,restrictedLabel:pl.restrictedLabel||'',restrictedXl:!!pl.restrictedXl,warnings:pl.warnings||[],notices:pl.notices||[],photo:pl.photo||'',foot:pl.foot||'',inDay:pl.inDay,weightTrend:pl.weightTrend||'',nextVet:pl.nextVet||'',rules:pl.rules||[],timetable:pl.timetable||[],reserved:pl.reserved||null,escalation:pl.escalation||'',vetLine:pl.vetLine||'',readyLabel:pl.readyLabel||'',walkLine:pl.walkLine||'',settleLine:pl.settleLine||'',reason:pl.reason||''};
}
function newDog(){FIELDS.forEach(function(id){setVal(id,'');});DATA={};render();window.scrollTo(0,0);}
function downloadPage(){var css=document.querySelector('style').innerHTML;var name=(val('f_name')||'dog').replace(/[^a-z0-9]/gi,'-').toLowerCase();
  var html='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><title>'+name+' — kennel card</title><style>'+css+'body{background:#fff}@media screen{.kc-sheet{margin:18px auto}}</style></head><body>'+document.getElementById('sheet').innerHTML+'</body></html>';
  var blob=new Blob([html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-kennel-card.html';a.click();}
function fit(){var pane=document.querySelector('.previewPane'),sheet=document.querySelector('.kc-sheet'),sc=document.getElementById('scaler');if(!sheet)return;sc.style.transform='scale(1)';var avail=Math.min(pane.clientWidth,document.documentElement.clientWidth)-8,sw=sheet.offsetWidth;var k=Math.min(1,avail/sw);sc.style.transform='scale('+k+')';sc.style.height=(sheet.offsetHeight*k)+'px';}
window.addEventListener('resize',fit);window.addEventListener('beforeprint',function(){var sc=document.getElementById('scaler');sc.style.transform='none';sc.style.height='auto';});window.addEventListener('afterprint',fit);
(function(){var drop=document.getElementById('drop'),file=document.getElementById('file');
  function readImg(f){if(!f||!f.type.match(/^image\//))return;var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var MAX=900,w=img.width,h=img.height;if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);DATA.photo=cv.toDataURL('image/jpeg',0.85);render();};img.src=rd.result;};rd.readAsDataURL(f);}
  drop.onclick=function(){file.click();};file.onchange=function(){readImg(file.files[0]);};
  drop.ondragover=function(e){e.preventDefault();drop.classList.add('on');};drop.ondragleave=function(){drop.classList.remove('on');};drop.ondrop=function(e){e.preventDefault();drop.classList.remove('on');readImg(e.dataTransfer.files[0]);};
})();
applyPayload(loadPayload());render();
</script></body></html>
