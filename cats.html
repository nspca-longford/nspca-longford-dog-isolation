<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--color-background-primary:#fff;--color-text-primary:#282932;--color-text-secondary:#6b7280;--color-border-secondary:#e4e7e0;--color-border-tertiary:#eef0ea;--lime:#c6e76c;--ink:#282932}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--color-text-primary);background:#f4f5f2;font-size:14px;line-height:1.45}
h2{font-size:17px;font-weight:800;letter-spacing:-0.01em;margin:0 0 4px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:2px;min-width:24px;background:linear-gradient(90deg,#c6e76c,rgba(198,231,108,0))}
.card{background:#fff;border:1px solid #e4e7e0;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(40,41,50,0.04)}
.lbl{display:block;font-size:10px;font-weight:800;color:#868b7e;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.11em}
input,select,textarea{font-family:inherit;font-size:13.5px;font-weight:600;color:#282932;background:#fbfcf9;border:1.5px solid #e4e7e0;border-radius:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#282932;background:#fff;box-shadow:0 0 0 3px rgba(198,231,108,0.45)}
input::placeholder,textarea::placeholder{font-weight:500;color:#a1a5a8}
select{padding:8px 10px;border:1px solid rgba(40,41,50,0.12);border-radius:8px;background:#fff}
.btn{background:#fff;border:1.5px solid #d9dcd3;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#282932}
.btnp{background:var(--lime);color:var(--ink);border:1.5px solid var(--lime);font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.ctgrid{display:grid;grid-template-columns:1fr;gap:0;align-items:start}
.ctcol{min-width:0}
.cards-grid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@media(max-width:900px){.g3{grid-template-columns:1fr}}
.dcardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dcard{background:#fff;border:1px solid #e4e7e0;border-radius:13px;cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(40,41,50,.03);transition:border-color .14s,box-shadow .14s,transform .14s}
.dcard:hover{border-color:#cfd4cf;box-shadow:0 4px 16px -8px rgba(40,41,50,.18);transform:translateY(-1px)}
.dcard .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:13px 0 0 13px}
.dcard.tg .stripe{background:#16a34a}.dcard.ty .stripe{background:#f59e0b}.dcard.tr .stripe{background:#dc2626}.dcard.tb .stripe{background:#282932}.dcard.tn .stripe{background:#e4e7e0}
.dcard-in{padding:12px 13px 12px 16px}
.dtop{display:flex;gap:10px;align-items:flex-start}
.dthumb{width:64px;height:64px;border-radius:14px;flex:none;overflow:hidden;background:linear-gradient(135deg,#fbfdf4,#eef7d8);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 1px rgba(19,22,27,.09),0 2px 6px -2px rgba(19,22,27,.12)}
.dthumb img{width:100%;height:100%;object-fit:cover;display:block}
.dinfo{flex:1;min-width:0}
.dname{font-size:14px;font-weight:700;letter-spacing:-.005em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta{font-size:11px;color:#9a9fa8;font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkennel{font-size:10px;font-weight:700;color:#4b5160;background:#f1f3ee;border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.dbottom{margin-top:10px;padding-top:9px;border-top:1px solid #f1f3ee}
.drow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dstatus{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
.dstatus .dd{width:7px;height:7px;border-radius:999px;flex:none}
.dcard.tg .dstatus .dd{background:#16a34a}.dcard.tg .dstatus{color:#16a34a}
.dcard.ty .dstatus .dd{background:#f59e0b}.dcard.ty .dstatus{color:#f59e0b}
.dcard.tr .dstatus .dd{background:#dc2626}.dcard.tr .dstatus{color:#dc2626}
.dcard.tb .dstatus .dd{background:#282932}.dcard.tb .dstatus{color:#282932}
.dcard.tn .dstatus .dd{background:#cfd4cf}.dcard.tn .dstatus{color:#9a9fa8}
.dayno{font-size:10.5px;color:#9a9fa8;font-weight:600;font-variant-numeric:tabular-nums}
.dflagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.dflag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.dflag.ea{background:#c6e76c;color:#3a4a16}
.dflag.warn{background:#fef3e2;color:#b45309}
.dflag.crit{background:#fee2e2;color:#b91c1c}
.dflag.prov{background:#fff;color:#b45309;border:1px solid #f59e0b}
.dflag.ok{background:#f1f3ee;color:#9a9fa8;font-weight:600}
.med-chev{color:#cfd4cf;font-size:15px;transition:transform .15s}
.apill{font-size:12px;padding:6px 15px;border-radius:18px;cursor:pointer;font-family:inherit;border:0.5px solid rgba(40,41,50,0.16);background:#fff;color:#4b5160}
.apill.on{background:var(--ink);color:var(--lime);border-color:var(--ink);font-weight:700}
.tabbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabbtn{background:#fff;border:0.5px solid rgba(40,41,50,0.16);padding:7px 15px;font-size:12.5px;color:#4b5160;cursor:pointer;font-family:inherit;border-radius:18px}
.tabbtn.on{background:#c6e76c;color:#282932;border-color:#c6e76c;font-weight:800}
.dml{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#9a9fa8;padding:8px 12px 3px}
.dmi{padding:9px 12px;font-size:13px;color:#282932;cursor:pointer;border-radius:8px}
.dmi:hover{background:#f1f3ee}
.dnext{font-size:11.5px;font-weight:700;margin:6px 12px 0;display:flex;align-items:center;gap:5px;line-height:1.3}
.dnext.r{color:#991b1b}.dnext.a{color:#92400e}.dnext.t{color:#0f766e}.dnext.q{color:#6b7280;font-weight:600}
.today{background:#282932;border-radius:16px;padding:12px 14px 6px;color:#fff;margin-bottom:12px}
.today .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.today .th b{font-size:12px;font-weight:800;color:#c6e76c;letter-spacing:.06em;text-transform:uppercase}
.today .th span{font-size:11px;color:#9aa0b0;font-weight:600}
.ti{display:flex;align-items:center;gap:10px;padding:9px 0 9px 11px;border-top:1px solid rgba(255,255,255,0.08);font-size:13px;cursor:pointer;border-left:3px solid #454857}
.ti.r{border-left-color:#ef4444}.ti.a{border-left-color:#f59e0b}.ti.t{border-left-color:#2dd4bf}.ti.q{border-left-color:#454857}
.ti .tw{flex:1;min-width:0;line-height:1.3}.ti .tw b{font-weight:800}.ti .tw small{display:block;color:#9aa0b0;font-size:11px;font-weight:600}
.ti .tkn{background:#c6e76c;color:#282932;font-weight:800;font-size:9.5px;padding:1px 6px;border-radius:5px;vertical-align:middle}
.ti .tgo{color:#c6e76c;font-weight:800;font-size:11px;white-space:nowrap}
.tmore{text-align:center;font-size:11px;color:#9aa0b0;font-weight:700;padding:8px 0 4px;border-top:1px solid rgba(255,255,255,0.08);cursor:pointer}
.fpills{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;padding-bottom:2px}
.fpills::-webkit-scrollbar{display:none}
.fp{white-space:nowrap;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:20px;border:1.5px solid #e4e7e0;background:#fff;color:#6b7280;cursor:pointer;font-family:inherit}
.fp.on{background:#282932;color:#c6e76c;border-color:#282932}
.fp i{font-style:normal;background:#eef1ea;color:#3f4a2e;border-radius:10px;padding:0 6px;margin-left:5px;font-size:10px}
.fp.on i{background:#c6e76c;color:#282932}
.dempty{border:1.5px dashed #cfd4c8;border-radius:13px;padding:12px 12px;display:flex;align-items:center;gap:9px;color:#9aa0b0;font-weight:700;font-size:12px;background:transparent;min-height:58px}
.dempty .dk{background:#e9ece4;color:#6b7280;font-weight:800;font-size:10px;padding:2px 7px;border-radius:6px}
.dempty .das{margin-left:auto;color:#c6e76c;background:#282932;padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:800;cursor:pointer}
.dsec{grid-column:1/-1;font-size:10.5px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:#6b7280;margin:8px 0 -2px;display:flex;align-items:center;gap:10px}
.dsec span{font-weight:700;letter-spacing:0;text-transform:none;color:#9aa0b0;font-size:11px}
.dsec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#c6e76c,rgba(198,231,108,0))}
</style>
</head>

var CHANGELOG=[
  {version:"1.3",date:"2026-09-02",note:"The cats board learns from the dogs. A Today card lists the shift\u0027s cat jobs \u2014 RCP 2nd due, ready for the Cattery, quarantine finishing, kitten first jab, FeLV/FIV not tested, kitten not weighed \u2014 each opening the cat on the right tab, with Dismiss until tomorrow. Filter pills with counts replace the stat rail (All, Cat Iso, Cattery, Contagious, Ready, Kittens, Not tested). The board is a map of the pens: Iso 1\u20135, Q 1\u20139 and Pod 1\u201316 always shown, empty pens with a + assign that starts a new cat already placed there. Every card carries one next-thing line."},
  {version:"1.2",date:"2026-09-02",note:"Holdfast, cats edition. The brand skin from the dog app: NSPCA charcoal and Lichen, warm greys, the NSPCA mark on the login screen and headers, the Holdfast lock-up at the foot of the login screen, Lichen active tabs, thicker traffic-light card edges, the field focus glow, and the anchor favicon. Emoji removed from the interface. Nothing about how cats are recorded has changed."},
  {version:"1.1",date:"2026-08-26",note:"Quarantine corrected to 10 days \u2014 Shane\u0027s number, replacing my 7-day default. Cards and records now count Day n of 10, and the Cattery gate opens on day 10."},
  {version:"1.0",date:"2026-08-26",note:"The cat record grows up \u2014 three big pieces. A 7-day quarantine clock: every iso cat shows Day n of 7 on its card and record, and turns \u2705 Ready for the Cattery only when quarantine is served, there\u0027s no live contagious case and the first vaccination is logged \u2014 kittens under 12 weeks always need that first jab before moving, whatever the day count. An Arrival tab \u2014 demeanour, posture, first-day eating, litter use, what handling was tolerated. And a Temperament tab \u2014 the socialisation read (confident through likely-feral), what the cat tolerates, best-home guess, and a running log of sit-in sessions. The 7-day length and the gate rules are my defaults \u2014 one number and one function to change if the unit runs it differently."},
  {version:"0.7",date:"2026-08-23",note:"The browser-tab icon is now the proper cat mark \u2014 the black walking cat on brand lime \u2014 traced to a vector so it stays sharp at any size."},
  {version:"0.6",date:"2026-08-23",note:"The record reads like a details page now \u2014 a header strip with the cat's photo, name, pod, area and a big day counter, sitting above pill-style tabs like the dog app's. The dashboard has the \u2630 menu: What's new, a full CSV export of every cat, the jump to Dogs, and log out. And the page remembers which area you were looking at \u2014 leave it on Cat Iso and it opens on Cat Iso next time, no questions asked. A heather cat sits in the browser tab too."},
  {version:"0.5",date:"2026-08-23",note:"Two things. The cat side now has its own quiet signature \u2014 a heather tint on the Cats badge and the selected filter \u2014 so you always know which wing you're in at a glance; everything else stays matched to the dog app. And the pods are real now: 16 in the Cattery, and under the Iso/Quarantine roof 5 Iso pods and 9 Quarantine pods. Picking a pod is a dropdown that shows who's already where, a taken pod can't be double-booked, the stat rail shows occupancy against capacity, and moving a cat between areas asks for a fresh pod on arrival."},
  {version:"0.4",date:"2026-08-23",note:"The dashboard now feels like the dog app's. The stat rail across the top \u2014 all cats, Cat Iso, Cattery, contagious \u2014 each one a tap-to-filter, the same search bar, and the same cards: photo, coloured stripe for where the cat stands (amber in Iso, green in the Cattery, red if contagious), pen badge, day counter, and flags for anything that matters. The clock is in the header too."},
  {version:"0.3",date:"2026-08-23",note:"Proper branding. The real NSPCA wordmark on the login, the dashboard and the record header \u2014 the same mark, sizes and treatment as the dog app \u2014 and the Inter font actually loading rather than falling back to whatever the computer had."},
  {version:"0.2",date:"2026-08-23",note:"The layout now matches the dog app \u2014 one column, cards stacked, same width. The side-by-side panels are gone."},
  {version:"0.1",date:"2026-08-23",note:"The Cats page exists. Log in with the same code as the dog app \u2014 if you\u0027re already signed in there, you\u0027re signed in here. Every cat gets a record: identity and intake, medical written for cats (FeLV and FIV testing, RCP and FeLV vaccinations, cat diseases with the contagious ones flagged), weights, notices, notes and the outcome. The dashboard shows the whole cat side at once, filtered by area \u2014 Isolation/Quarantine or the main Cattery \u2014 and moving a cat between them is one button that keeps a log of who moved it and when. The rules for those moves (how long isolation runs, what clears a cat across) come in the next part."}
];

var SUPABASE_URL="https://sbajswwuykvjhtoehfps.supabase.co";
var SUPABASE_KEY="sb_publishable_uP40lclXeaMzJ__zFQESHQ__XSLqJgK";
var supabaseClient=null;
function initSupabase(){
  supabaseClient={from:function(table){
    var base=SUPABASE_URL+"/rest/v1/"+table;
    var headers={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
    return{
      select:function(cols){
        var q=base+"?select="+(cols||"*");
        var chain={
          eq:function(col,val){q+="&"+col+"=eq."+encodeURIComponent(val);return chain;},
          limit:function(n){q+="&limit="+n;return chain;},
          order:function(col,opts){q+="&order="+col+(opts&&opts.ascending===false?".desc":".asc");return chain;},
          then:function(res,rej){return fetch(q,{headers:headers}).then(function(r){return r.json().then(function(d){var result=r.ok?{data:d,error:null}:{data:null,error:d};if(res)res(result);return result;});}).catch(function(e){var result={data:null,error:{message:e.message}};if(rej)rej(result);return result;});}
        };return chain;
      },
      insert:function(rows){return fetch(base,{method:"POST",headers:Object.assign({},headers,{"Prefer":"return=representation"}),body:JSON.stringify(Array.isArray(rows)?rows[0]:rows)}).then(function(r){return r.json().then(function(d){return r.ok?{data:Array.isArray(d)?d:[d],error:null}:{data:null,error:d};});});},
      update:function(data){var q2=base;return{eq:function(col,val){q2+="?"+col+"=eq."+encodeURIComponent(val);return fetch(q2,{method:"PATCH",headers:Object.assign({},headers,{"Prefer":"return=representation"}),body:JSON.stringify(data)}).then(function(r){return r.json().then(function(d){return r.ok?{data:d,error:null}:{data:null,error:d};});});}};},
      delete:function(){return{eq:function(col,val){return fetch(base+"?"+col+"=eq."+encodeURIComponent(val),{method:"DELETE",headers:headers}).then(function(r){return r.ok?{data:null,error:null}:{data:null,error:{message:"Delete failed"}};});}};}
    };
  }};return true;
}

var USERS=[
  {code:"SHC01",name:"Shane",role:"admin"},
  {code:"SUZ01",name:"Suzanne",role:"director"},
  {code:"SAR01",name:"Sarah",role:"manager"},

var CURRENT_USER=null,LOGGED_IN=false;
function currentName(){return CURRENT_USER?CURRENT_USER.name:(localStorage.getItem("nspca-user-name")||"Staff");}
function currentRole(){return CURRENT_USER?CURRENT_USER.role:(localStorage.getItem("nspca-user-role")||"staff");}
async function findUserByCode(code){
  var u=USERS.find(function(x){return x.code===code;});
  if(u)return u;
  if(!supabaseClient)return null;
  try{
    var res=await supabaseClient.from("users").select("*").eq("code",code).limit(1);
    if(res&&res.data&&res.data[0]&&res.data[0].active!==false)return res.data[0];
  }catch(e){}
  return null;
}
async function doLogin(){
  var el=document.getElementById("login-code");var code=(el&&el.value||"").trim();
  var u=await findUserByCode(code);
  if(!u){var er=document.getElementById("login-err");if(er)er.style.display="block";return;}
  LOGGED_IN=true;CURRENT_USER=u;
  localStorage.setItem("nspca-intake-auth",u.code);
  localStorage.setItem("nspca-user-name",u.name);localStorage.setItem("nspca-user-role",u.role);
  loadCats().then(function(){showScreen("dashboard-screen");renderDashboard();});
}

function exportCatsCSV(){
  var head=["Name","Area","Pod","Sex","Colour","DOB","Age estimate","Microchip","Intake","Days in care","Health status","FeLV","FIV","Contagious","Outcome","Outcome date"];
  var rows=cats.map(function(r){
    var st=r.state||{},c=st.cat||{},m=st.medical||{},t=m.testing||{},f=st.fin||{};
    var con=activeContagiousCats(m).map(function(x){return x.type;}).join("; ");
    return [r.name||"",AREAS[(st.area||r.area)!=="cattery"?"iso":"cattery"],c.pen||"",c.sex||"",c.colour||"",c.dob||"",c.ageEstimate||"",c.microchip||"",c.intakeDate||"",(daysSince(r.intakeDate)!==null?daysSince(r.intakeDate)+1:""),m.currentStatus||"",t.felv||"",t.fiv||"",con,f.outcome||"",f.outcomeDate||""];
  });
  var csv=[head].concat(rows).map(function(row){return row.map(function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\n");
  try{
    var blob=new Blob([csv],{type:"text/csv"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nspca-cats-"+new Date().toISOString().slice(0,10)+".csv";a.click();
  }catch(e){appAlert("Could not build the export on this device.");}
}

// ── shared utilities (copied from the dog app, unchanged) ─────────
function esc(s){return(s===null||s===undefined?"":""+s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function fmtDMY(ds){if(ds===null||ds===undefined||ds==="")return"";if(ds instanceof Date){if(isNaN(ds))return"";return ("0"+ds.getDate()).slice(-2)+"-"+("0"+(ds.getMonth()+1)).slice(-2)+"-"+(""+ds.getFullYear()).slice(2);}var p=(""+ds).slice(0,10).split("-");if(p.length===3&&p[0].length===4)return p[2]+"-"+p[1]+"-"+p[0].slice(2);return ""+ds;}
function fmtAgo(ts){if(!ts)return"never";var diff=Math.round((Date.now()-(typeof ts==="number"?ts:new Date(ts).getTime()))/60000);if(diff<1)return"just now";if(diff<60)return diff+"m ago";if(diff<1440)return Math.round(diff/60)+"h ago";return Math.round(diff/1440)+"d ago";}
function daysSince(ds){if(!ds)return null;var p=String(ds).slice(0,10).split("-");if(p.length!==3)return null;var then=new Date(+p[0],(+p[1])-1,+p[2]);if(isNaN(then.getTime()))return null;var n=new Date();var today=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.max(0,Math.round((today-then)/864e5));}
function initials(n){var p=(n||"").trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():(n||"?").slice(0,2).toUpperCase();}
function miniToast(msg){var e=document.getElementById("mini-toast");if(e)e.remove();var t=document.createElement("div");t.id="mini-toast";t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(40,41,50,0.92);color:#fff;padding:9px 15px;border-radius:20px;font-size:12.5px;max-width:88vw;text-align:center;z-index:9999;box-shadow:0 6px 24px rgba(40,41,50,0.28);opacity:0;transition:opacity .25s,transform .25s;font-family:inherit";t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){requestAnimationFrame(function(){t.style.opacity="1";t.style.transform="translateX(-50%) translateY(0)";});});setTimeout(function(){t.style.opacity="0";setTimeout(function(){if(t.parentNode)t.remove();},300);},2200);}
function appConfirm(message,onConfirm){

function catCardHtml(r){
  var st=r.state||{};var c=st.cat||{};var m=st.medical||{};
  var area=(st.area||r.area)!=="cattery"?"iso":"cattery";
  var days=daysSince(r.intakeDate);

  var t=(m.testing)||{};
  var cls=con.length?"tr":area==="iso"?"ty":"tg";
  var ph=c.photo?'<img src="'+c.photo+'" alt="'+esc(r.name||'cat')+'">':'<span style="font-size:26px;opacity:.75">\ud83d\udc31</span>';
  var meta=[c.colour||null,c.sex?String(c.sex).split(" ")[0]:null,c.ageEstimate||null].filter(Boolean).join(" \u00b7 ");
  var flags=[];
  if(con.length)flags.push('<span class="dflag crit">\u2623\ufe0f Contagious</span>');
  if(t.felv==="Positive")flags.push('<span class="dflag crit">FeLV +</span>');
  if(t.fiv==="Positive")flags.push('<span class="dflag">FIV +</span>');
  if(!t.felv&&!t.fiv)flags.push('<span class="dflag">Not tested</span>');
  if(area==="iso"&&!((st.fin||{}).outcome)){
    var ci=catClearInfo(st);
    if(ci.ready)flags.push('<span class="dflag" style="background:#dcfce7;color:#166534">\u2705 Ready for Cattery</span>');
    else if(ci.day)flags.push('<span class="dflag">\u23f3 Day '+ci.day+'/'+ISO_DAYS+'</span>');

  return '<div onclick="openCat('+r.id+')" tabindex="0" role="button" aria-label="Open '+esc(r.name||"cat")+'" onkeydown="if(event.key===\'Enter\'){openCat('+r.id+')}" class="dcard '+cls+'"><div class="stripe"></div><div class="dcard-in">'
    +'<div class="dtop"><div class="dthumb">'+ph+'</div><div class="dinfo"><div class="dname">'+esc(r.name||"Unnamed")+'</div>'+(meta?'<div class="dmeta">'+esc(meta)+'</div>':'')+'</div>'+(c.pen?'<span class="dkennel">'+esc(c.pen)+'</span>':'')+'</div>'
    +(function(){var nx=catNextThing(r);return nx?'<div class="dnext '+nx.c+'">'+nx.t+'</div>':'';})()
    +'<div class="dbottom"><div class="drow"><div class="dstatus"><span class="dd"></span>'+AREAS[area]+'</div>'+(days!==null?'<div class="dayno">Day '+(days+1)+'</div>':'')+'</div>'
    +(flags.length?'<div class="dflagrow">'+flags.join("")+'</div>':'')
    +'</div></div></div>';

var ISO_DAYS=10; // quarantine length \u2014 confirmed by Shane 26-08-26
function kittenUnder12w(c){
  c=c||{};
  if(c.dob){var w=(Date.now()-new Date(c.dob).getTime())/(7*864e5);if(!isNaN(w)&&w<12)return true;}
  var a=String(c.ageEstimate||"").toLowerCase();
  var m=a.match(/(\d+)\s*w/);if(m&&parseInt(m[1])<12)return true;
  if(/kitten/.test(a)&&!/older|adult/.test(a))return true;

function firstVaxGiven(med){return ((med&&med.vaccinations)||[]).some(function(v){return /1st|first|RCP/i.test(v.type||"")&&v.date;});}
function catClearInfo(st){
  st=st||C;var c=st.cat||{};var day=daysSince(c.intakeDate);day=day===null?null:day+1;
  var con=activeContagiousCats(st.medical).length>0;
  var vax=firstVaxGiven(st.medical);

  var blocks=[];
  if(day!==null&&day<ISO_DAYS)blocks.push("day "+day+" of "+ISO_DAYS);
  if(con)blocks.push("live contagious case");

  return{day:day,ready:blocks.length===0,blocks:blocks,kitten:kitten};

}
function renderMedicalTab(){
  var m=C.medical||{};var t=m.testing||{};
  var con=activeContagiousCats(m);
  var banner=con.length?hybridBanner("Contagious \u2014 "+esc(con.map(function(x){return x.type;}).join(", ")),"alert")
    :m.currentStatus==="Not fit for rehoming"?hybridBanner("Not fit for rehoming","alert")
    :hybridBanner(m.currentStatus||"No health status set",m.currentStatus==="Healthy"?"ok":m.currentStatus?"warn":"");
  var testSum=[t.felv?("FeLV "+t.felv):null,t.fiv?("FIV "+t.fiv):null,t.testedDate?fmtDMY(t.testedDate):null].filter(Boolean).join(" \u00b7 ")||"Not tested yet";
  var testTone=(t.felv==="Positive"||t.fiv==="Positive")?"alert":(!t.felv&&!t.fiv)?"warn":"";
  var dsRows=(m.diseases||[]).map(function(p,i){
    var act=p.status!=="Recovered / cleared";
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px">'
      +'<span style="flex:1;color:'+(act&&CONTAGIOUS_CATS[p.type]?"#991b1b;font-weight:600":"#454857")+'">'+esc(p.type)+(CONTAGIOUS_CATS[p.type]&&act?" \u2623\ufe0f":"")+'</span>'
      +'<span style="color:#9a9fa8">'+esc(p.status||"")+(p.date?" \u00b7 "+fmtDMY(p.date):"")+'</span>'
      +'<button onclick="cycleDisease('+i+')" style="background:#e4e7e0;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">'+(act?"Mark cleared":"Reactivate")+'</button>'
      +'<button onclick="removeDisease('+i+')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">&#10005;</button></div>';
  }).join("")||'<div style="font-size:11.5px;color:#cfd4cf;padding:2px 0 6px">Nothing recorded.</div>';
  var vaxRows=(m.vaccinations||[]).map(function(v,i){
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px"><span style="flex:1">'+esc(v.type)+'</span><span style="color:#9a9fa8">'+fmtDMY(v.date)+(v.nextDue?" \u00b7 next "+fmtDMY(v.nextDue):"")+'</span><button onclick="removeVax('+i+')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">&#10005;</button></div>';
  }).join("")||'<div style="font-size:11.5px;color:#cfd4cf;padding:2px 0 6px">None recorded yet.</div>';
  return '<div class="ctgrid"><div class="ctcol"><div class="card">'+banner
    +slct("Health status",m.currentStatus||"","medical.currentStatus",[["","\u2014 not set \u2014"],["Healthy","Healthy"],["Monitoring","Monitoring"],["Under treatment","Under treatment"],["Recovering","Recovering"],["Not fit for rehoming","Not fit for rehoming"]])
    +hybridRow("ct-test","\ud83e\uddea","FeLV / FIV testing",esc(testSum),
      '<div class="g3">'+slct("FeLV",t.felv||"","medical.testing.felv",[["","Not tested"],["Negative","Negative"],["Positive","Positive"],["Retest needed","Retest needed"]])
      +slct("FIV",t.fiv||"","medical.testing.fiv",[["","Not tested"],["Negative","Negative"],["Positive","Positive"],["Retest needed","Retest needed"]])
      +fld("Tested",t.testedDate,"medical.testing.testedDate","date")+'</div>',testTone)
    +hybridRow("ct-dis","\ud83e\udda0","Conditions & diseases",((m.diseases||[]).length?(m.diseases.length+" recorded"+(con.length?" \u00b7 "+con.length+" contagious":"")):"Nothing recorded"),
      dsRows+'<div style="display:flex;gap:8px;margin-top:8px"><select id="new-disease" style="flex:1">'+CAT_DISEASES.map(function(dd){return '<option>'+dd+'</option>';}).join("")+'</select><button class="btn" onclick="addDisease()">Add</button></div>',con.length?"alert":"")
    +'</div></div>'
    +'<div class="ctcol"><div class="card">'
    +hybridRow("ct-vax","\ud83d\udc89","Vaccinations",((m.vaccinations||[]).length?m.vaccinations.length+" recorded":"None recorded yet"),
      vaxRows+'<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><select id="new-vax" style="flex:1;min-width:130px">'+CAT_VAX.map(function(v){return '<option>'+v+'</option>';}).join("")+'</select><input id="new-vax-date" type="date" style="padding:8px 10px;border:1px solid rgba(40,41,50,0.12);border-radius:8px"><button class="btn" onclick="addVax()">Add</button></div>',(m.vaccinations||[]).length?"":"warn")
    +ta("Vet notes",m.vetNotes,"medical.vetNotes","anything the vet said or needs watching")
    +'</div></div></div>';
}
function addDisease(){var el=document.getElementById("new-disease");if(!el)return;C.medical.diseases=C.medical.diseases||[];C.medical.diseases.push({type:el.value,status:"Active",date:new Date().toISOString().slice(0,10)});debouncedSave();renderMain();}
function cycleDisease(i){var p=(C.medical.diseases||[])[i];if(!p)return;p.status=p.status==="Recovered / cleared"?"Active":"Recovered / cleared";debouncedSave();renderMain();}
function removeDisease(i){appConfirm("Remove this condition from the record?",function(){C.medical.diseases.splice(i,1);debouncedSave();renderMain();});}
function addVax(){var el=document.getElementById("new-vax");var de=document.getElementById("new-vax-date");if(!el)return;C.medical.vaccinations=C.medical.vaccinations||[];C.medical.vaccinations.push({type:el.value,date:(de&&de.value)||new Date().toISOString().slice(0,10)});debouncedSave();renderMain();}
function removeVax(i){appConfirm("Remove this vaccination entry?",function(){C.medical.vaccinations.splice(i,1);debouncedSave();renderMain();});}
function renderWeightsTab(){
  var ws=(C.weights||[]).slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
  var rows=ws.slice().reverse().map(function(w,ri){var i=ws.length-1-ri;
    var prev=i>0?ws[i-1]:null;var diff=prev?(w.kg-prev.kg):null;
    return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12.5px"><span style="color:#9a9fa8;width:70px">'+fmtDMY(w.date)+'</span><span style="font-weight:600">'+w.kg+' kg</span>'+(diff!==null?'<span style="font-size:11px;color:'+(diff<0?"#991b1b":"#166534")+'">'+(diff>0?"+":"")+diff.toFixed(2)+'</span>':'')+'<span style="flex:1"></span><button onclick="removeWeight('+i+')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">&#10005;</button></div>';
  }).join("")||'<div style="font-size:11.5px;color:#cfd4cf;padding:2px 0 8px">No weights yet \u2014 the first one becomes the baseline.</div>';
  return '<div class="card" style="max-width:560px">'
    +'<div style="display:flex;gap:8px;margin-bottom:12px"><input id="new-w" type="number" step="0.01" placeholder="kg" style="width:110px;padding:8px 10px;border:1px solid rgba(40,41,50,0.12);border-radius:8px"><input id="new-w-date" type="date" value="'+new Date().toISOString().slice(0,10)+'" style="padding:8px 10px;border:1px solid rgba(40,41,50,0.12);border-radius:8px"><button class="btn btnp" onclick="addWeight()">Add</button></div>'
    +rows+'</div>';
}
function addWeight(){var el=document.getElementById("new-w");var de=document.getElementById("new-w-date");var kg=parseFloat(el&&el.value);if(!kg)return;C.weights=C.weights||[];C.weights.push({date:(de&&de.value)||new Date().toISOString().slice(0,10),kg:kg});debouncedSave();renderMain();}
function removeWeight(i){var ws=(C.weights||[]).slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));});var w=ws[i];C.weights=C.weights.filter(function(x){return x!==w;});debouncedSave();renderMain();}
function renderNotesTab(){
  var ns=C.notices||[];
  var rows=ns.map(function(n,i){return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px"><span style="flex:1">\ud83d\udd14 '+esc(n.text)+'</span><span style="color:#9a9fa8;font-size:11px">'+(n.by?esc(n.by)+" \u00b7 ":"")+fmtDMY(n.at)+'</span><button onclick="removeNotice('+i+')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer">&#10005;</button></div>';}).join("")||'<div style="font-size:11.5px;color:#cfd4cf;padding:2px 0 8px">No notices \u2014 anything the whole team must know about this cat goes here.</div>';
  return '<div class="ctgrid"><div class="ctcol"><div class="card">'
    +'<div style="font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9a9fa8;margin:0 0 8px">Notices</div>'
    +rows+'<div style="display:flex;gap:8px;margin-top:8px"><input id="new-notice" type="text" placeholder="e.g. door-darter \u2014 double-check the pen latch" style="flex:1;padding:8px 10px;border:1px solid rgba(40,41,50,0.12);border-radius:8px"><button class="btn" onclick="addNotice()">Add</button></div>'
    +'</div></div>'
    +'<div class="ctcol"><div class="card">'+ta("General notes",C.notes,"notes","temperament, habits, anything worth knowing")+'</div></div></div>';
}
function addNotice(){var el=document.getElementById("new-notice");if(!el||!el.value.trim())return;C.notices=C.notices||[];C.notices.push({text:el.value.trim(),by:currentName(),at:new Date().toISOString().slice(0,10)});el.value="";debouncedSave();renderMain();}
function removeNotice(i){C.notices.splice(i,1);debouncedSave();renderMain();}
function renderOutcomeTab(){
  var f=C.fin||{};
  var banner=f.outcome?hybridBanner(esc(f.outcome)+(f.outcomeDate?" \u00b7 "+fmtDMY(f.outcomeDate):""),"alert"):hybridBanner("Active \u2014 in the unit","ok");
  return '<div class="card" style="max-width:560px">'+banner
    +slct("Outcome",f.outcome||"","fin.outcome",CAT_OUTCOMES.map(function(o){return [o,o||"Active \u2014 in the unit"];}))
    +fld("Date",f.outcomeDate,"fin.outcomeDate","date")
    +ta("Outcome notes",f.outcomeNotes,"fin.outcomeNotes","where it went, who took it, anything worth keeping")
    +(f.outcome?'<div style="font-size:11.5px;color:#854d0e;background:#fef9c3;border-radius:8px;padding:8px 11px">A cat with an outcome leaves the live dashboard and shows under Departed.</div>':'')
    +'</div>';
}

// ── init ──────────────────────────────────────────────────────────
(function(){
  initSupabase();
  var savedCode=localStorage.getItem("nspca-intake-auth");
  if(savedCode){
    findUserByCode(savedCode).then(function(u){
      if(u){LOGGED_IN=true;CURRENT_USER=u;localStorage.setItem("nspca-user-name",u.name);localStorage.setItem("nspca-user-role",u.role);
        loadCats().then(function(){showScreen("dashboard-screen");renderDashboard();});}
      else showScreen("login-screen");
    });
  }else showScreen("login-screen");
})();
</script>
</body>
</html>
