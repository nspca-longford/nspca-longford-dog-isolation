<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NSPCA Longford Weekly Rota</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo:wght@600;800&display=swap">
<style>
/* Layout: day strip on top, one day at a time as colour-banded department rows; week grid and person finder as alternates */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1b2230; --muted:#5d6676; --line:#dde1e8; --accent:#1d5fae;
  --tint-l:92%; --tint-s:70%; --ink-l:30%; --ink-s:60%; --dot-l:48%;
  --hl-bg:#1b2230; --hl-fg:#ffffff;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --fg:#e8ecf2; --muted:#9aa3b2; --line:#2c3440; --accent:#7fb2f0;
  --tint-l:20%; --tint-s:40%; --ink-l:82%; --ink-s:65%; --dot-l:62%;
  --hl-bg:#e8ecf2; --hl-fg:#12161d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --fg:#e8ecf2; --muted:#9aa3b2; --line:#2c3440; --accent:#7fb2f0;
  --tint-l:20%; --tint-s:40%; --ink-l:82%; --ink-s:65%; --dot-l:62%;
  --hl-bg:#e8ecf2; --hl-fg:#12161d; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:2px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem}
.sub b{color:var(--fg)}
.flag{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:hsl(30 80% var(--ink-l));background:hsl(38 90% var(--tint-l));padding:2px 8px;border-radius:99px;vertical-align:2px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:4px;border-radius:10px}
.tabs button{font:inherit;font-weight:700;font-size:.95rem;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.days .dn{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.days .dd{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.days button[aria-pressed="true"]{background:var(--hl-bg);color:var(--hl-fg);border-color:var(--hl-bg)}
.days button[aria-pressed="true"] .dn{color:inherit;opacity:.8}
.days .today{position:relative}
.days .today::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

.finder{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.finder label{font-weight:700;font-size:.9rem;color:var(--muted)}
.finder select{font:inherit;font-size:1rem;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0;flex:1;max-width:260px}

.dayhead{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:4px 0 0}
.list{display:flex;flex-direction:column;gap:8px}
.dept{--h:210;display:grid;grid-template-columns:8.2rem 1fr;align-items:stretch;background:hsl(var(--h) var(--tint-s) var(--tint-l));border-radius:10px;overflow:hidden}
.dept .lab{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;font-weight:700;font-size:.92rem;color:hsl(var(--h) var(--ink-s) var(--ink-l));border-left:6px solid hsl(var(--h) 65% var(--dot-l))}
.dept .names{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;align-content:center;min-width:0}
.name{background:var(--surface);color:var(--fg);border-radius:99px;padding:4px 11px;font-size:1rem;white-space:nowrap}
.name.me{background:var(--hl-bg);color:var(--hl-fg);font-weight:700}
.dim .dept:not(.has-me){opacity:.45}

.gridwrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{padding:7px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{font-family:var(--display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface)}
thead th.cur{color:var(--accent)}
tbody th{--h:210;position:sticky;left:0;z-index:1;background:hsl(var(--h) var(--tint-s) var(--tint-l));color:hsl(var(--h) var(--ink-s) var(--ink-l));border-left:5px solid hsl(var(--h) 65% var(--dot-l));white-space:nowrap;font-size:.82rem}
tbody td{--h:210;background:hsl(var(--h) var(--tint-s) calc(var(--tint-l) + 3%))}
tbody td div{white-space:nowrap}
td .me{background:var(--hl-bg);color:var(--hl-fg);border-radius:4px;padding:0 4px;font-weight:700}
thead th:first-child{position:sticky;left:0;z-index:2}

.person{display:flex;flex-direction:column;gap:8px}
.prow{--h:210;display:grid;grid-template-columns:5.5rem 1fr;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prow .pd{padding:10px 12px;font-weight:700}
.prow .pd small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.prow .pj{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px}
.tag{--h:210;background:hsl(var(--h) var(--tint-s) var(--tint-l));color:hsl(var(--h) var(--ink-s) var(--ink-l));border-left:4px solid hsl(var(--h) 65% var(--dot-l));padding:4px 10px;border-radius:6px;font-weight:700;font-size:.92rem}
.off{color:var(--muted);font-style:italic}
.empty{color:var(--muted);padding:12px 0}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{--h:210;width:10px;height:10px;border-radius:3px;background:hsl(var(--h) 65% var(--dot-l))}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.dept{grid-template-columns:6.8rem 1fr}.dept .lab{font-size:.85rem}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>NSPCA Longford Weekly Rota</h1>
    <div class="sub"><b>Mon 26 Oct – Sun 1 Nov 2026</b><span class="flag">Subject to change</span></div>
  </header>

  <div class="tabs" role="tablist">
    <button id="t-day" role="tab" aria-selected="true" data-v="day">Day</button>
    <button id="t-week" role="tab" aria-selected="false" data-v="week">Week</button>
    <button id="t-person" role="tab" aria-selected="false" data-v="person">Person</button>
  </div>

  <div class="finder">
    <label for="who">Highlight</label>
    <select id="who"></select>
  </div>

  <div id="view"></div>

  <div class="legend" id="legend"></div>
</div>

<script>
const DAYS=[["Mon","26","Monday 26th"],["Tue","27","Tuesday 27th"],["Wed","28","Wednesday 28th"],["Thu","29","Thursday 29th"],["Fri","30","Friday 30th"],["Sat","31","Saturday 31st"],["Sun","1","Sunday 1st"]];
const DATES=["2026-10-26","2026-10-27","2026-10-28","2026-10-29","2026-10-30","2026-10-31","2026-11-01"];
const R=[
 ["Kennels",212,[["Jordan","Andrea"],["Denis","Hayleigh"],["Alison","Calum","Hayleigh"],["Calum","Jordan"],["Alison","Jordan"],["Alison","Jordan","Denis"],["Alison","Jordan"]]],
 ["Quiet",178,[["Hayleigh"],["Fiona"],["Denis","Fiona"],["Denis"],["Denis"],["Fiona"],["Fiona"]]],
 ["Cattery / Cat ISO",270,[["Rebecca","Jade"],["Andrea","Sarah"],["Jade","Rebecca","Sarah"],["Rebecca","Mollie","Sarah"],["Rebecca","Mollie","Sarah"],["Rebecca","Mollie","Sarah"],["Andrea","Mollie"]]],
 ["Small Mammals",40,[["Jade"],["Sarah"],["Sarah"],["Sarah"],["Sarah"],["Sarah"],["Jade"]]],
 ["Isolation",356,[["Shane","Weronika"],["Shane","Weronika"],["Shane"],["Hayleigh"],["Weronika","Calum"],["Shane","Calum"],["Shane"]]],
 ["Stables",24,[["Laura W","Robyn"],["Laura W","Robyn"],["Laura W","Robyn"],["Ciara"],["Ciara"],["Laura W","Robyn"],["Laura W","Robyn"]]],
 ["Reception",320,[["Mollie"],["Cathy"],["Cathy"],["Cathy"],["Cathy"],["Mollie"],["Cathy"]]],
 ["Rehoming",135,[["Laura"],["Laura"],["Ciara"],["Sarah O"],["Laura"],["Laura"],["Laura"]]],
 ["Super / Vet / Admin",225,[["Hayleigh"],["Hayleigh"],["Hayleigh"],["Hayleigh"],["Ciara"],["Ciara"],["Ciara"]]]
];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const people=[...new Set(R.flatMap(r=>r[2].flat()))].sort((a,b)=>a.localeCompare(b));

let store={};try{store=JSON.parse(localStorage.getItem("nacRota")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("nacRota",JSON.stringify({who:state.who,view:state.view}))}catch(e){}};

const todayISO=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
const todayIdx=DATES.indexOf(todayISO);
const state={view:store.view||"day",day:todayIdx>=0?todayIdx:0,who:people.includes(store.who)?store.who:""};

const sel=document.getElementById("who");
sel.innerHTML='<option value="">Nobody</option>'+people.map(p=>`<option${p===state.who?" selected":""}>${esc(p)}</option>`).join("");
sel.onchange=()=>{state.who=sel.value;save();render()};

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.view=b.dataset.v;save();render()});

document.getElementById("legend").innerHTML=R.map(r=>`<span><i style="--h:${r[1]}"></i>${esc(r[0])}</span>`).join("");

function dayStrip(){
  return `<div class="days">${DAYS.map((d,i)=>`<button id="d${i}" aria-pressed="${i===state.day}" class="${i===todayIdx?"today":""}" data-i="${i}"><span class="dn">${d[0]}</span><span class="dd">${d[1]}</span></button>`).join("")}</div>`;
}
function dayView(){
  const i=state.day;
  const rows=R.map(r=>{
    const ns=r[2][i];const has=state.who&&ns.includes(state.who);
    return `<div class="dept${has?" has-me":""}" style="--h:${r[1]}"><div class="lab">${esc(r[0])}</div><div class="names">${ns.map(n=>`<span class="name${n===state.who?" me":""}">${esc(n)}</span>`).join("")}</div></div>`;
  }).join("");
  return dayStrip()+`<h2 class="dayhead">${DAYS[i][2]}${i===todayIdx?" · Today":""}</h2><div class="list${state.who?" dim":""}">${rows}</div>`;
}
function weekView(){
  const head=`<tr><th></th>${DAYS.map((d,i)=>`<th class="${i===todayIdx?"cur":""}">${d[0]} ${d[1]}</th>`).join("")}</tr>`;
  const body=R.map(r=>`<tr><th style="--h:${r[1]}">${esc(r[0])}</th>${r[2].map(ns=>`<td style="--h:${r[1]}">${ns.map(n=>`<div>${n===state.who?`<span class="me">${esc(n)}</span>`:esc(n)}</div>`).join("")}</td>`).join("")}</tr>`).join("");
  return `<div class="gridwrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function personView(){
  if(!state.who) return `<p class="empty">Pick a name above to see their week.</p>`;
  const rows=DAYS.map((d,i)=>{
    const jobs=R.filter(r=>r[2][i].includes(state.who));
    return `<div class="prow"><div class="pd">${d[0]} ${d[1]}${i===todayIdx?"<small>Today</small>":""}</div><div class="pj">${jobs.length?jobs.map(r=>`<span class="tag" style="--h:${r[1]}">${esc(r[0])}</span>`).join(""):'<span class="off">Not on rota</span>'}</div></div>`;
  }).join("");
  return `<h2 class="dayhead">${esc(state.who)}'s week</h2><div class="person">${rows}</div>`;
}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===state.view));
  const v=document.getElementById("view");
  v.innerHTML=state.view==="week"?weekView():state.view==="person"?personView():dayView();
  v.querySelectorAll(".days button").forEach(b=>b.onclick=()=>{state.day=+b.dataset.i;render()});
}
render();
</script>

</body>
</html>
