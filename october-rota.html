<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NSPCA Longford October Rota</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo:wght@600;800&display=swap">
<style>
/* Layout: tabs (Day / Month / Person); team colours on names, status colours on cells — same scheme as the original sheet */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1b2230; --muted:#5d6676; --line:#dde1e8; --accent:#1d5fae;
  --tint-l:90%; --tint-s:75%; --ink-l:28%; --dot-l:50%;
  --off-bg:#eceef2; --off-fg:#6b7383;
  --al-bg:#d92d20; --al-fg:#ffffff; --sick-bg:#f79009; --sick-fg:#1b2230; --toil-bg:#fdd835; --toil-fg:#1b2230;
  --hl-bg:#1b2230; --hl-fg:#ffffff;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --fg:#e8ecf2; --muted:#9aa3b2; --line:#2c3440; --accent:#7fb2f0;
  --tint-l:21%; --tint-s:40%; --ink-l:82%; --dot-l:62%;
  --off-bg:#232a35; --off-fg:#8e98a8;
  --al-bg:#e5484d; --al-fg:#ffffff; --sick-bg:#f5a524; --sick-fg:#12161d; --toil-bg:#f2d541; --toil-fg:#12161d;
  --hl-bg:#e8ecf2; --hl-fg:#12161d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --fg:#e8ecf2; --muted:#9aa3b2; --line:#2c3440; --accent:#7fb2f0;
  --tint-l:21%; --tint-s:40%; --ink-l:82%; --dot-l:62%;
  --off-bg:#232a35; --off-fg:#8e98a8;
  --al-bg:#e5484d; --al-fg:#ffffff; --sick-bg:#f5a524; --sick-fg:#12161d; --toil-bg:#f2d541; --toil-fg:#12161d;
  --hl-bg:#e8ecf2; --hl-fg:#12161d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem}.sub b{color:var(--fg)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:4px;border-radius:10px}
.tabs button{font:inherit;font-weight:700;font-size:.95rem;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrl label{font-weight:700;font-size:.9rem;color:var(--muted)}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);flex:1;max-width:280px;min-width:0}
.step{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;width:42px;height:40px;cursor:pointer}
h2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0}
.teams{display:flex;flex-direction:column;gap:10px}
.team{--h:28;background:hsl(var(--h) var(--tint-s) var(--tint-l));border-left:6px solid hsl(var(--h) 70% var(--dot-l));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.team h3{margin:0;font-size:.92rem;color:hsl(var(--h) 60% var(--ink-l))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);color:var(--fg);border-radius:99px;padding:4px 11px;white-space:nowrap}
.chip.me{background:var(--hl-bg);color:var(--hl-fg);font-weight:700}
.away{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.away div{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.away b{min-width:6.5rem;font-size:.9rem}
.st{display:inline-block;border-radius:5px;padding:1px 7px;font-weight:700;font-size:.82rem}
.st.A{background:var(--al-bg);color:var(--al-fg)}.st.S{background:var(--sick-bg);color:var(--sick-fg)}.st.T{background:var(--toil-bg);color:var(--toil-fg)}.st.O{background:var(--off-bg);color:var(--off-fg)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;font-size:.78rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:5px 2px;min-width:38px}
thead th{background:var(--surface);color:var(--muted);font-weight:700;line-height:1.15;position:sticky;top:0}
thead th small{display:block;font-weight:400;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
thead th.we{color:var(--fg)} thead th.cur{background:var(--hl-bg);color:var(--hl-fg)}
th.nm{--h:28;position:sticky;left:0;z-index:2;text-align:left;padding:5px 8px;white-space:nowrap;min-width:110px;font-size:.85rem;
  background:hsl(var(--h) var(--tint-s) calc(var(--tint-l) - 4%));color:hsl(var(--h) 60% var(--ink-l));border-left:5px solid hsl(var(--h) 70% var(--dot-l))}
thead th.nm{z-index:3;background:var(--surface);border-left-color:var(--surface)}
td{--h:28;font-weight:700}
td.X{background:hsl(var(--h) var(--tint-s) var(--tint-l));color:hsl(var(--h) 60% var(--ink-l))}
td.O{background:var(--off-bg);color:var(--off-fg);font-weight:400}
td.A{background:var(--al-bg);color:var(--al-fg)} td.S{background:var(--sick-bg);color:var(--sick-fg)} td.T{background:var(--toil-bg);color:var(--toil-fg)}
td.N{background:var(--surface);color:var(--muted)}
td.cur{box-shadow:inset 2px 0 var(--fg),inset -2px 0 var(--fg)}
tr.me th.nm{background:var(--hl-bg);color:var(--hl-fg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;font-weight:700}
.cal .c{border-radius:8px;padding:6px 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700}
.cal .c .n{font-family:var(--display);font-size:1.05rem}
.cal .c.X{--h:28;background:hsl(var(--h) var(--tint-s) var(--tint-l));color:hsl(var(--h) 60% var(--ink-l))}
.cal .c.O{background:var(--off-bg);color:var(--off-fg);font-weight:400}
.cal .c.A{background:var(--al-bg);color:var(--al-fg)}.cal .c.S{background:var(--sick-bg);color:var(--sick-fg)}.cal .c.T{background:var(--toil-bg);color:var(--toil-fg)}
.cal .c.N{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.cal .c.cur{outline:2px solid var(--fg);outline-offset:1px}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.counts span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.9rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.note{font-size:.82rem;color:var(--muted)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="wrap">
  <header><h1>NSPCA Longford October Rota</h1>
  <div class="sub"><b>Wed 30 Sep – Fri 30 Oct 2026</b> · Oct 2026 V4</div></header>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-day" data-v="day" aria-selected="true">Day</button>
    <button role="tab" id="t-month" data-v="month" aria-selected="false">Month</button>
    <button role="tab" id="t-person" data-v="person" aria-selected="false">Person</button>
  </div>
  <div class="ctrl"><label for="who">Highlight</label><select id="who"></select></div>
  <div id="view"></div>
  <div class="legend" id="legend"></div>
</div>
<script>
const D={"teams": [["Dogs", 28], ["Cats & small animals", 290], ["Stables", 140], ["Reception & office", 48]], "rows": [["Alison", 0, "OAAAAOOOAAXXXOOXXOXOOOXXXXOOXOX"], ["Calum", 0, "XXXOXOXXOXXOXOXOXXOOOXXXXOOOXXX"], ["Denis", 0, "XXXXOOXXXXXOOXXXXXOOXXXXXOOXXXX"], ["Hayleigh", 0, "XXOOXAXXXOOXXXXXOOXXXXXOOXXXXXO"], ["Fiona", 0, "OOOAAAAOOOXXXXOOOXXXOXOOOXOXXOO"], ["Jade", 0, "OOXXSSXOOXXXOXOXXXXXOOXXXXXOOXA"], ["Rebecca Forbes", 0, "TTOTTAOAAOOAOAAOXXXXOXXOOOXOXXO"], ["Shane", 0, "OXXXXXOXXXOOXXXOXXXXXOOXXXXXOOX"], ["Weronika", 0, "XOXXOXXXXXOOXXXXXOOXXXOXXXXXOOX"], ["Jordan", 0, "OXXXXXOOXXXXXOOXXXXOXOXXXXXOOXX"], ["Sarah", 1, "XXXXOXXXOSXOOXXXXAOOXXXXXOOXXXX"], ["Hilda", 1, "-------------------------------"], ["Andrea", 1, "OOXXXXXOOXXXXXOOXXXXXOOXXXXXOOX"], ["Mollie", 1, "XXOOAXXOOXXXXOOXXXOXXOXXXXXOOXX"], ["Jamie", 2, "OXXXXXOOXXXXXOOXXXXXOOXXXXTOOAA"], ["Laura W", 2, "XOOOXXXXOOOXXXXOOOXXXXOOOXXXXOO"], ["Robyn", 2, "-----XXXXXOOXXXOOXXXXXOOXXXXXOO"], ["Ciara", 3, "XAOOAAAXXXXXOOXXXXXOOXXXXXOOXXX"], ["Sarah O", 3, "OOXSXXOOXXXXXOOXXXTXXOOAAXXXXOO"], ["Cathy", 3, "OOXXOXXXXXOOAAAAXOOAXXXXXOOXXXX"], ["Laura", 3, "XXOOXXXOOXXXXXOOXXXXXOOXXXXXOOX"]], "dates": ["2026-09-30", "2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04", "2026-10-05", "2026-10-06", "2026-10-07", "2026-10-08", "2026-10-09", "2026-10-10", "2026-10-11", "2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15", "2026-10-16", "2026-10-17", "2026-10-18", "2026-10-19", "2026-10-20", "2026-10-21", "2026-10-22", "2026-10-23", "2026-10-24", "2026-10-25", "2026-10-26", "2026-10-27", "2026-10-28", "2026-10-29", "2026-10-30"]};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],DL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],ML=["January","February","March","April","May","June","July","August","September","October","November","December"];
const dates=D.dates.map(s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)});
const LBL={X:"In",O:"Off",A:"A/L",S:"Sick",T:"TOIL","-":"–"},NAME={A:"Annual leave",S:"Sick",T:"TOIL",O:"Off"};
const cls=c=>c==="-"?"N":c;
const t=new Date(),ti=dates.findIndex(d=>d.toDateString()===t.toDateString());
let st={};try{st=JSON.parse(localStorage.getItem("octRota")||"{}")}catch(e){}
const names=D.rows.filter(r=>r[2]!=="-".repeat(31)).map(r=>r[0]);
const S={view:st.view||"day",day:ti>=0?ti:30,who:names.includes(st.who)?st.who:""};
const save=()=>{try{localStorage.setItem("octRota",JSON.stringify({view:S.view,who:S.who}))}catch(e){}};
const sel=document.getElementById("who");
sel.innerHTML='<option value="">Nobody</option>'+names.map(n=>`<option${n===S.who?" selected":""}>${esc(n)}</option>`).join("");
sel.onchange=()=>{S.who=sel.value;save();render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();render()});
document.getElementById("legend").innerHTML=D.teams.map(([n,h])=>`<span><i style="background:hsl(${h} 70% 50%)"></i>${esc(n)}</span>`).join("")+
 `<span><i style="background:var(--al-bg)"></i>A/L</span><span><i style="background:var(--sick-bg)"></i>Sick</span><span><i style="background:var(--toil-bg)"></i>TOIL</span><span><i style="background:var(--off-bg)"></i>Off</span>`;
const fmt=d=>`${DL[d.getDay()]} ${d.getDate()} ${ML[d.getMonth()]}`;
function day(){
  const i=S.day,d=dates[i];
  const teams=D.teams.map(([tn,h],k)=>{const inn=D.rows.filter(r=>r[1]===k&&r[2][i]==="X");
    return `<div class="team" style="--h:${h}"><h3>${esc(tn)} · ${inn.length} in</h3><div class="chips">${inn.length?inn.map(r=>`<span class="chip${r[0]===S.who?" me":""}">${esc(r[0])}</span>`).join(""):'<span class="note">Nobody rostered</span>'}</div></div>`}).join("");
  const away=["A","S","T","O"].map(c=>{const p=D.rows.filter(r=>r[2][i]===c);return p.length?`<div><b>${NAME[c]}</b>${p.map(r=>`<span class="st ${c}">${esc(r[0])}</span>`).join(" ")}</div>`:""}).join("");
  return `<div class="ctrl"><button class="step" id="prev" aria-label="Previous day">‹</button><select id="dsel">${dates.map((x,k)=>`<option value="${k}"${k===i?" selected":""}>${fmt(x)}${k===ti?" · Today":""}</option>`).join("")}</select><button class="step" id="next" aria-label="Next day">›</button></div>
  <h2>${fmt(d)}${i===ti?" · Today":""}</h2><div class="teams">${teams}</div><div class="away">${away}</div>`;
}
function month(){
  const head=`<tr><th class="nm">Name</th>${dates.map((d,k)=>`<th class="${k===ti?"cur":(d.getDay()%6===0?"we":"")}"><small>${DN[d.getDay()]}</small>${d.getDate()}</th>`).join("")}</tr>`;
  const body=D.rows.map(([n,k,v])=>{const h=D.teams[k][1];return `<tr class="${n===S.who?"me":""}"><th class="nm" style="--h:${h}">${esc(n)}</th>${[...v].map((c,j)=>`<td class="${cls(c)}${j===ti?" cur":""}" style="--h:${h}">${LBL[c]}</td>`).join("")}</tr>`}).join("");
  return `<div class="gridwrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div><p class="note">Scroll sideways for the rest of the month. Names stay pinned on the left.</p>`;
}
function person(){
  if(!S.who) return `<p class="note">Pick a name above to see their month.</p>`;
  const row=D.rows.find(r=>r[0]===S.who),h=D.teams[row[1]][1],v=row[2];
  const lead=(dates[0].getDay()+6)%7;
  const cells=Array(lead).fill('<div></div>').join("")+dates.map((d,k)=>`<div class="c ${cls(v[k])}${k===ti?" cur":""}" style="--h:${h}"><span class="n">${d.getDate()}</span>${LBL[v[k]]}</div>`).join("");
  const cnt=c=>[...v].filter(x=>x===c).length;
  return `<h2>${esc(S.who)}</h2><div class="counts"><span><b>${cnt("X")}</b> days in</span><span><b>${cnt("O")}</b> off</span>${cnt("A")?`<span><b>${cnt("A")}</b> A/L</span>`:""}${cnt("S")?`<span><b>${cnt("S")}</b> sick</span>`:""}${cnt("T")?`<span><b>${cnt("T")}</b> TOIL</span>`:""}</div>
  <div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="dh">${x}</div>`).join("")}${cells}</div>`;
}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===S.view));
  const el=document.getElementById("view");
  el.innerHTML=S.view==="month"?month():S.view==="person"?person():day();
  const ds=document.getElementById("dsel");
  if(ds){ds.onchange=()=>{S.day=+ds.value;render()};
    document.getElementById("prev").onclick=()=>{if(S.day>0){S.day--;render()}};
    document.getElementById("next").onclick=()=>{if(S.day<30){S.day++;render()}};}
  if(S.view==="month"&&ti>=0){const w=el.querySelector(".gridwrap");if(w)w.scrollLeft=Math.max(0,(ti-3)*38);}
}
render();
</script>

</body>
</html>
