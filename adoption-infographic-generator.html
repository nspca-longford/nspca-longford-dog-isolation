<style>
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f5f2;color:#282932}
.top{background:#282932;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.top img{height:22px;display:block}.top .t{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9a9fa8;border-left:1px solid #454857;padding-left:12px;margin-left:12px}
.top .l{display:flex;align-items:center}
.btn{background:#fff;border:1.5px solid #d9dcd3;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:#282932}
.btnp{background:#c6e76c;border-color:#c6e76c;font-weight:800}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:18px;padding:18px;max-width:1300px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:10px}.form{position:static;max-height:none}.top{flex-wrap:wrap}.top>div:last-child{width:100%;display:flex;gap:6px}.top .btn{flex:1;padding:9px 6px;font-size:12px}}
.form{background:#fff;border:1px solid #e4e7e0;border-radius:14px;padding:16px;align-self:start;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.fg{margin-bottom:10px}.fg label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;color:#868b7e;margin-bottom:4px}
.fg input{width:100%;box-sizing:border-box;border:1.5px solid #e4e7e0;background:#fbfcf9;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;color:#282932;font-family:inherit;outline:none}
.fg input:focus{border-color:#282932;background:#fff;box-shadow:0 0 0 3px rgba(198,231,108,.45)}
.drop{border:1.5px dashed #cfd4c8;border-radius:10px;padding:14px;text-align:center;font-size:12px;color:#6b7280;font-weight:600;cursor:pointer;margin-bottom:12px}
.drop.on{border-color:#c6e76c;background:#f7fbe9}
.previewPane{overflow:auto}
#scaler{transform-origin:top left}
.kc-sheet{width:210mm;height:297mm;background:#fff;color:#282932;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;position:relative;display:flex;flex-direction:column}
.kc-sheet *{box-sizing:border-box}
.kc-hero{position:relative;height:150mm;flex-shrink:0;background:#dfe6cf center 30%/cover no-repeat}
.kc-hero[data-nophoto]{background:linear-gradient(160deg,#333542,#282932)}
.kc-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,16,21,.18) 0%,rgba(15,16,21,0) 32%,rgba(15,16,21,0) 52%,rgba(15,16,21,.84) 100%)}
.kc-hero .top{position:absolute;top:8mm;left:10mm;right:10mm;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.kc-hero .top img{height:7mm;filter:brightness(2)}
.kc-hero .kn{background:#c6e76c;color:#282932;font-weight:900;font-size:30pt;line-height:1;padding:3mm 6mm;border-radius:4mm;letter-spacing:-.02em}
.kc-hero .con{position:absolute;top:22mm;right:10mm;z-index:2;background:#dc2626;color:#fff;font-weight:900;font-size:9pt;letter-spacing:.08em;padding:2mm 4mm;border-radius:2mm}
.kc-hero .rdy{position:absolute;top:22mm;right:10mm;z-index:2;background:#c6e76c;color:#282932;font-weight:900;font-size:9pt;letter-spacing:.06em;padding:2mm 4mm;border-radius:2mm}
.kc-hero .name{position:absolute;left:10mm;right:10mm;bottom:9mm;z-index:2;color:#fff}
.kc-hero h1{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:900;font-size:62pt;line-height:.9;letter-spacing:-.02em;margin:0;word-break:break-word;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.kc-hero .who{font-size:12pt;font-weight:700;color:#e6e9f0;margin-top:3mm;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.kc-hero .words{margin-top:3.5mm;display:flex;gap:2mm;flex-wrap:wrap}.kc-hero .words span{background:#c6e76c;color:#282932;font-weight:900;font-size:10.5pt;padding:1.4mm 3.4mm;border-radius:2mm}
.kc-light{display:grid;grid-template-columns:30mm 1fr;flex-shrink:0}
.kc-light .lt{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15pt;text-align:center;line-height:1.05;padding:3mm}.kc-light .lt span{font-size:9pt;font-weight:800;margin-top:1mm;opacity:.85}
.kc-light .tx{padding:4mm 8mm;font-size:13.5pt;font-weight:800;line-height:1.3;display:flex;flex-direction:column;justify-content:center}.kc-light .tx small{display:block;font-size:9.5pt;font-weight:700;opacity:.75;margin-top:1.5mm}
.kc-body{padding:7mm 10mm 0;display:grid;grid-template-columns:1.3fr 1fr;gap:8mm;flex:1;min-height:0;overflow:hidden}
.kc-about{font-family:Fraunces,Georgia,"Times New Roman",serif;font-size:12pt;line-height:1.55;font-weight:600;overflow:hidden}
.kc-about p{margin:0}.kc-about p+p{margin-top:3mm}.kc-about b{font-weight:900}
.kc-about .no,.kc-about .ok{font-family:Inter,sans-serif;font-weight:900;font-size:10pt;padding:.8mm 2.4mm;border-radius:1.5mm;white-space:nowrap}
.kc-about .no{background:#fee2e2;color:#991b1b}.kc-about .ok{background:#dcfce7;color:#166534}
.kc-about p.w{font-family:Inter,sans-serif;font-weight:900;font-size:11pt;color:#991b1b}.kc-about p.w.crit{background:#dc2626;color:#fff;padding:2mm 3mm;border-radius:2mm}
.kc-about p.n{font-family:Inter,sans-serif;font-weight:700;font-size:10pt;color:#4b5160}
.kc-side{min-width:0}
.kc-side .h{font-size:8pt;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#6b7280;margin-bottom:2.5mm;padding-bottom:1.2mm;border-bottom:.7mm solid #c6e76c}
.kc-side .tt{width:100%;border-collapse:collapse}.kc-side .tt td{font-size:9.5pt;padding:1.8mm 0;border-bottom:.4mm solid #eef0ea;font-weight:700;vertical-align:top;line-height:1.25}.kc-side .tt td.t{width:12mm;color:#6b7280;font-weight:900}
.kc-side .empty{font-size:9.5pt;font-weight:700;color:#4b5160}
.kc-side .facts{margin-top:4mm;font-size:8.5pt;line-height:1.7;color:#4b5160;font-weight:600}.kc-side .facts b{color:#282932;font-weight:800}
.kc-side .pen{margin-top:4mm;border:.5mm dashed #cfd4c8;border-radius:3mm;min-height:22mm;padding:2.5mm 3mm;font-size:10pt;font-weight:600;line-height:1.5;white-space:pre-wrap}
.kc-side .pen:empty::before{content:attr(data-ph);font-size:7.5pt;font-weight:800;color:#9a9fa8;letter-spacing:.12em;text-transform:uppercase}
.kc-side .pen:focus{outline:.6mm solid #c6e76c}
.kc-foot{padding:3mm 10mm 6mm;display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;font-size:7.5pt;color:#9a9fa8;font-weight:700;flex-shrink:0;line-height:1.5}
.kc-qr{width:18mm;text-align:center;flex-shrink:0}.kc-qr img{width:18mm;height:18mm;display:block;border:.5mm solid #cfd4c8;border-radius:2mm;padding:.8mm;background:#fff}.kc-qr span{display:block;font-size:6.5pt;font-weight:800;color:#6b7280;margin-top:.5mm}
@page{size:A4;margin:0}
@media print{body{background:#fff;margin:0}.kc-sheet{width:210mm;height:297mm;box-shadow:none;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

var KC_TL={Green:["#dcfce7","#166534","#22c55e","#052e16"],Yellow:["#fef9c3","#713f12","#facc15","#422006"],Red:["#fee2e2","#7f1d1d","#ef4444","#fff"],Black:["#282932","#f1f3ee","#0f1015","#c6e76c"]};
function kcEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function kcShortKennel(k){return String(k||"").replace(/^Kennel\s*/i,"K").replace(/^Pod\s*/i,"P")||"—";}
function kcCardHtml(P,MARK){
  var e=kcEsc;var tl=P.tl?(KC_TL[P.tl]||["#f1f3ee","#282932","#cfd4c8","#282932"]):null;
  var words=P.threeWords?'<div class="words">'+String(P.threeWords).split(/[·,;]+/).map(function(w){return w.trim();}).filter(Boolean).slice(0,4).map(function(w){return '<span>'+e(w)+'</span>';}).join('')+'</div>':'';
  var who=[P.breed+(P.breed2?' × '+P.breed2:''),P.sex,P.age,P.intake?'in since '+P.intake:'',P.assessor?'ask for '+P.assessor:''].filter(Boolean).join(' · ');
  var hero='<div class="kc-hero"'+(P.photo?' style="background-image:url('+P.photo+');background-position:'+e(P.photoPos||'50% 30%')+'"':' data-nophoto="1"')+'><div class="top"><img src="'+MARK+'" alt="NSPCA"><div class="kn">'+e(kcShortKennel(P.kennel))+'</div></div>'+(P.contagious&&P.contagious.length?'<div class="con">CONTAGIOUS · '+e(P.contagious.join(', '))+' · full PPE · serve last</div>':'')+(P.readyLabel?'<div class="rdy">'+e(P.readyLabel)+'</div>':'')+'<div class="name"><h1>'+e(P.name||'Unnamed dog')+'</h1><div class="who">'+e(who)+'</div>'+words+'</div></div>';
  var rule;
  if(tl){var why=P.floored?'Held at '+e(P.tl)+(P.floorCat?' by a finding in '+e(P.floorCat):'')+' — do not downgrade.':(P.scoreProvisional?'Provisional — '+(P.scoredN!=null?P.scoredN:'?')+' of 6 categories scored.':'');
    rule='<div class="kc-light" style="background:'+tl[0]+';color:'+tl[1]+'"><div class="lt" style="background:'+tl[2]+';color:'+tl[3]+'">'+e(P.tl.toUpperCase())+(P.score!=null&&P.score!==''?'<span>'+e(String(P.score))+' / 24</span>':'')+'</div><div class="tx">'+e(P.walkRule||'Who can walk this dog: ask the assessor.')+(why?'<small>'+why+'</small>':'')+'</div></div>';}
  else rule='<div class="kc-light" style="background:#f1f3ee;color:#4b5160"><div class="lt" style="background:#cfd4c8;color:#282932">NOT<br>SCORED</div><div class="tx">Designated staff only until assessed.</div></div>';
  var story=P.story||(P.about?'<p>'+e(P.about).replace(/\n\n+/g,'</p><p>')+'</p>':'');
  var warns=(P.warnings||[]).map(function(w){var t=typeof w==="string"?w:w.text;var c=typeof w==="object"&&w.critical;return '<p class="w'+(c?' crit':'')+'">'+e(t)+'</p>';}).join('');
  var notices=(P.notices||[]).map(function(n){return typeof n==="string"?n:n.text;}).filter(Boolean);
  var about='<div class="kc-about">'+(story||'<p style="color:#9a9fa8">Nothing written about this dog yet — fill in Arrival, the Assessment and Care, and the card writes itself.</p>')+warns+(notices.length?'<p class="n">'+e(notices.join(' · '))+'</p>':'')+(P.eaMgmt?'<p class="n">EA: '+e(P.eaMgmt)+'</p>':'')+'</div>';
  var tt=(P.timetable||[]).slice();if(P.walkLine)tt.push({t:'12:00',w:P.walkLine});tt.sort(function(a,b){return String(a.t).localeCompare(String(b.t));});
  var day=tt.length?'<table class="tt">'+tt.map(function(r){return '<tr><td class="t">'+e(r.t)+'</td><td>'+e(r.w)+'</td></tr>';}).join('')+'</table>':'<div class="empty">'+e([P.feeding,P.meds].filter(Boolean).join(' · ')||'No routine set up yet.')+'</div>';
  var facts=[["Chip",P.chip],["Ref",P.ref],["Vax",P.vax],["Next vet",P.nextVet],["Weight",P.weight?(P.weight+(P.weightTrend?', '+P.weightTrend.replace(/^[▲▼▬]\s?/,'').replace(' since arrival',' since arrival'):'')):''],["Parasite",P.parasite],["Neutered",P.neutered],["Iso ends",P.isoEnds]].filter(function(f){return f[1];}).slice(0,7);
  var side='<div class="kc-side"><div class="h">'+(P.name?e(P.name.split(' ')[0])+'\u0027s day':'The day')+'</div>'+day+'<div class="facts">'+facts.map(function(f){return '<b>'+e(f[0])+'</b> '+e(f[1]);}).join('<br>')+'</div>'+(P.notes?'<div class="pen">'+e(P.notes)+'</div>':'<div class="pen" data-ph="Whiteboard marker, or tap here to type"></div>')+'</div>';
  var qr=P.webUrl?'<div class="kc-qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=0&data='+encodeURIComponent(P.webUrl)+'" alt=""><span>online</span></div>':'';
  var foot='<div class="kc-foot"><div>'+e(P.foot||'')+' · reprint when anything changes · NSPCA Longford · Dog Isolation Unit'+(P.isoLabel?' · '+e(P.isoLabel):'')+'</div>'+qr+'</div>';
  return '<div class="kc-sheet">'+hero+rule+'<div class="kc-body">'+about+side+'</div>'+foot+'</div>';
}

function payloadFromForm(){var P={};for(var k in DATA)P[k]=DATA[k];
  P.name=val('f_name');P.ref=val('f_ref');P.kennel=val('f_kennel');P.breed=val('f_breed');P.breed2=val('f_breed2');P.sex=val('f_sex');P.age=val('f_age');P.size=val('f_size');P.colour=val('f_colour');P.weight=val('f_weight');P.chip=val('f_chip');P.vax=val('f_vax');P.parasite=val('f_parasite');P.neutered=val('f_neutered');P.intake=val('f_intake');P.isoEnds=val('f_isoends');P.meds=val('f_meds');P.feeding=val('f_feeding');P.handling=val('f_handling');P.notes=val('f_notes');P.about=val('f_about');P.threeWords=val('f_words');P.assessor=val('f_assessor');P.webUrl=val('f_web');
  P.foot=DATA.foot||('Printed '+new Date().toLocaleString('en-IE'));return P;}
function render(){document.getElementById('sheet').innerHTML=kcCardHtml(payloadFromForm(),MARK).replace('<div class="kc-sheet">','<div class="kc-sheet" contenteditable="true" spellcheck="false">');fit();}
function loadPayload(){try{var raw=localStorage.getItem('nspca-kennelcard');if(raw)return JSON.parse(raw);}catch(e){}
  var p=new URLSearchParams(location.search),obj=null;['name','ref','kennel','breed','breed2','sex','age','size','colour','weight','chip','vax','parasite','neutered','intake','isoends','meds','feeding','handling'].forEach(function(k){if(p.has(k)){obj=obj||{};obj[k]=p.get(k);}});return obj;}
function applyPayload(pl){if(!pl)return;
  setVal('f_name',pl.name);setVal('f_ref',pl.ref!=null?pl.ref:pl.refNo);setVal('f_kennel',pl.kennel);setVal('f_breed',pl.breed);setVal('f_breed2',pl.breed2);setVal('f_sex',pl.sex);setVal('f_age',pl.age);setVal('f_size',pl.size);setVal('f_colour',pl.colour);setVal('f_weight',pl.weight);setVal('f_chip',pl.chip!=null?pl.chip:pl.microchip);setVal('f_intake',pl.intake!=null?pl.intake:pl.intakeDate);setVal('f_vax',pl.vax);setVal('f_parasite',pl.parasite);setVal('f_neutered',pl.neutered);setVal('f_isoends',pl.isoEnds!=null?pl.isoEnds:pl.isoends);setVal('f_meds',pl.meds);setVal('f_feeding',pl.feeding);setVal('f_handling',pl.handling);setVal('f_words',pl.threeWords);setVal('f_assessor',pl.assessor);setVal('f_web',pl.webUrl);
  DATA={isoLabel:pl.isoLabel||'',isoState:pl.isoState||'',tl:pl.tl||'',score:pl.score,walkRule:pl.walkRule||'',scoreProvisional:!!pl.scoreProvisional,scoredN:pl.scoredN,scoredOf:pl.scoredOf,floored:!!pl.floored,floorCat:pl.floorCat||'',eaCat:pl.eaCat||'',eaMgmt:pl.eaMgmt||'',contagious:pl.contagious||[],zoonotic:!!pl.zoonotic,restrictedLabel:pl.restrictedLabel||'',restrictedXl:!!pl.restrictedXl,warnings:pl.warnings||[],notices:pl.notices||[],photo:pl.photo||'',foot:pl.foot||'',inDay:pl.inDay,weightTrend:pl.weightTrend||'',nextVet:pl.nextVet||'',rules:pl.rules||[],timetable:pl.timetable||[],reserved:pl.reserved||null,escalation:pl.escalation||'',vetLine:pl.vetLine||'',readyLabel:pl.readyLabel||'',walkLine:pl.walkLine||'',settleLine:pl.settleLine||'',reason:pl.reason||'',story:pl.story||'',photoPos:pl.photoPos||'50% 30%'};
}
function newDog(){FIELDS.forEach(function(id){setVal(id,'');});DATA={};render();window.scrollTo(0,0);}
function downloadPage(){var css=document.querySelector('style').innerHTML;var name=(val('f_name')||'dog').replace(/[^a-z0-9]/gi,'-').toLowerCase();
  var html='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><title>'+name+' — kennel card</title><style>'+css+'body{background:#fff}@media screen{.kc-sheet{margin:18px auto}}</style></head><body>'+document.getElementById('sheet').innerHTML+'</body></html>';
  var blob=new Blob([html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-kennel-card.html';a.click();}
function fit(){var pane=document.querySelector('.previewPane'),sheet=document.querySelector('.kc-sheet'),sc=document.getElementById('scaler');if(!sheet)return;sc.style.transform='scale(1)';var avail=Math.min(pane.clientWidth,document.documentElement.clientWidth)-8,sw=sheet.offsetWidth;var k=Math.min(1,avail/sw);sc.style.transform='scale('+k+')';sc.style.height=(sheet.offsetHeight*k)+'px';}
window.addEventListener('resize',fit);window.addEventListener('beforeprint',function(){var sc=document.getElementById('scaler');sc.style.transform='none';sc.style.height='auto';});window.addEventListener('afterprint',fit);
(function(){var drop=document.getElementById('drop'),file=document.getElementById('file');
  function readImg(f){if(!f||!f.type.match(/^image\//))return;var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var MAX=900,w=img.width,h=img.height;if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);DATA.photo=cv.toDataURL('image/jpeg',0.85);render();};img.src=rd.result;};rd.readAsDataURL(f);}
  drop.onclick=function(){file.click();};file.onchange=function(){readImg(file.files[0]);};
  drop.ondragover=function(e){e.preventDefault();drop.classList.add('on');};drop.ondragleave=function(){drop.classList.remove('on');};drop.ondrop=function(e){e.preventDefault();drop.classList.remove('on');readImg(e.dataTransfer.files[0]);};
})();
applyPayload(loadPayload());render();
</script></body></html>
